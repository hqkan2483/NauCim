<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautilus.CIM - Проекты</title>
    <link rel="stylesheet" href="src/styles/00-fonts.css" />
    <link rel="stylesheet" href="src/styles/01-tokens.css" />
    <link rel="stylesheet" href="src/styles/02-body.css" />
    <link rel="stylesheet" href="src/styles/03-app-container.css" />
    <link rel="stylesheet" href="src/styles/04-utils.css" />
    <link rel="stylesheet" href="src/styles/05-sidebar-nav.css" />
    <link rel="stylesheet" href="src/styles/06-main-content.css" />
    <link rel="stylesheet" href="src/styles/07-info-style.css" />
    <link rel="stylesheet" href="src/styles/components/buttons.css" />
    <link rel="stylesheet" href="src/styles/components/toolbar.css" />
    <link rel="stylesheet" href="src/styles/components/project-cards.css" />
    <link rel="stylesheet" href="src/styles/components/quick-actions.css" />




    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page page-projects">
    <div class="app-container">
      <!-- SIDEBAR -->
      <div class="sidebar" id="sidebar">
        <button class="sidebar__toggle sidebar-open" aria-label="Toggle sidebar">
          <span class="sidebar__toggle-icon">☰</span>
        </button>

        <div class="sidebar__header">
          <span>Nautilus.CIM</span>
        </div>

        <div class="sidebar__nav">
          <a href="index.html" class="sidebar__nav-item">📊 Главная</a>

          <!-- Projects Tree -->
          <div class="nav-tree-item">
            <div class="nav-tree-header">
              <button
                class="nav-tree-toggle"
                aria-expanded="true"
                aria-label="Toggle projects list"
              >
                <span class="tree-icon">▶</span>
              </button>
              <span class="nav-tree-label">📁 Проекты</span>
            </div>

            <div
              id="projects-tree-container"
              class="nav-tree-children nav-tree-collapsed"
            >
              <div id="projects-list-tree"></div>
            </div>
          </div>

          <div class="sidebar__section-title">Текущий проект</div>
          <div id="current-project" class="sidebar__section-info">Нет проекта</div>

          <div class="sidebar__section-title">Действия</div>
          <div class="sidebar__nav-item" data-modal-open="new-project-modal">
            + Новый проект
          </div>

          <a href="compare.html" class="sidebar__nav-item">🔍 Сравнение</a>
        </div>
      </div>
      <div class="sidebar__resize-handle" id="sidebar-resize-handle"></div>

      <!-- MAIN CONTENT -->
      <div class="app-container__main-content main-content">
        <div class="toolbar">
          <div class="toolbar__title">Проекты</div>
          <div class="toolbar__actions">
            <button class="btn btn-primary" data-modal-open="new-project-modal">
              + Новый проект
            </button>
            <button class="btn btn-primary" onclick="location.reload()">
              🔄 Обновить
            </button>
          </div>
        </div>

        <!-- ✅ Добавить кнопку "Назад" -->
        <div class="back-navigation hidden" id="back-navigation">
          <button class="btn btn-secondary" id="back-to-projects-btn">
            ← Назад к списку проектов
          </button>
        </div>

        <div class="main-content__content-area content-area">
          <div class="search-box" id="search-box">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              class="search-input"
              id="search-projects"
              placeholder="Поиск проектов..."
            />
          </div>

          <div id="projects-list"></div>

          <!-- Models and Profiles containers (hidden by default) -->
          <div id="models-container" class="hidden">
            <div class="split-view">
              <div class="split-left">

                  <h3 class="no-margin">Модели</h3>
                  <!-- <button class="btn btn-primary btn-small" data-modal-open="new-model-modal"> + Новая модель </button> -->

                <div id="models-list"></div>
              </div>
              <div class="split-right">
                <div id="model-details"></div>
              </div>
            </div>
          </div>

          <div id="profiles-container" class="mt-30 hidden">
            <div class="divider mb-15"></div>
            <div class="split-view">
              <div class="split-left">

                  <h3 class="no-margin">Профили</h3>

                <div id="profiles-list"></div>
              </div>
              <div class="split-right">
                <div id="profile-details"></div>
              </div>
            </div>
          </div>

          <div class="divider mt-30 mb-30"></div>

          <div class="quick-actions hidden" id="open-project-action">
            <button class="btn btn-primary" id="open-current-project-btn">
              Перейти в проект
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modals будут загружены динамически через modal-loader. js -->
    <script type="module" src="./src/app/pages/projects-page.js"></script>
  </body>
</html>
