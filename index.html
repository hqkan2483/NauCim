<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautilus.CIM - Главная</title>
    <link rel="stylesheet" href="src/styles/00-fonts.css" />
    <link rel="stylesheet" href="src/styles/01-tokens.css" />
    <link rel="stylesheet" href="src/styles/02-body.css" />
    <link rel="stylesheet" href="src/styles/03-app-container.css" />
    <link rel="stylesheet" href="src/styles/04-utils.css" />
    <link rel="stylesheet" href="src/styles/05-sidebar-nav.css" />
    <link rel="stylesheet" href="src/styles/06-main-content.css" />
    <link rel="stylesheet" href="src/styles/07-info-style.css" />
    <link rel="stylesheet" href="src/styles/components/buttons.css" />
    <link rel="stylesheet" href="src/styles/components/toolbar.css" />
    <link rel="stylesheet" href="src/styles/components/project-cards.css" />
    <link rel="stylesheet" href="src/styles/components/quick-actions.css" />
    <link rel="stylesheet" href="src/styles/components/tabs.css" />
    <link rel="stylesheet" href="src/styles/components/tables.css" />
    <link rel="stylesheet" href="src/styles/components/forms.css" />
    <link rel="stylesheet" href="src/styles/components/warning-content.css" />
    <link rel="stylesheet" href="src/styles/components/modals.css" />



    <!-- <link rel="stylesheet" href="src/styles/pages/index.css" /> -->

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page page-index">
    <div class="app-container">
      <!-- SIDEBAR -->
      <div class="sidebar" id="sidebar">
        <button class="sidebar__toggle sidebar-open" aria-label="Toggle sidebar">
          <span class="sidebar__toggle-icon">☰</span>
        </button>

        <div class="sidebar__header">
          <span>Nautilus.CIM</span>
        </div>

        <div class="sidebar__nav">
          <a href="projects.html" class="sidebar__nav-item">📁 Проекты</a>

          <div class="sidebar__section-title">Текущий проект</div>
          <div id="current-project" class="sidebar__section-info">
            Нет проекта
          </div>

          <div class="sidebar__section-title">Действия</div>
          <div class="sidebar__nav-item" data-modal-open="new-project-modal">
            + Новый проект
          </div>

          <a href="compare.html" class="sidebar__nav-item">🔍 Сравнение</a>
        </div>
      </div>
      <div class="sidebar__resize-handle" id="sidebar-resize-handle"></div>

      <!-- MAIN CONTENT -->
      <div class="app-container__main-content main-content">
        <div class="toolbar">
          <div class="toolbar__title">Главная</div>
          <div class="toolbar__actions">
            <button class="btn btn-primary" id="refresh-btn">
              🔄 Обновить
            </button>
          </div>
        </div>

        <div class="main-content__content-area content-area">
          <h3 class="section-title">Недавние проекты</h3>
          <div id="recent-projects" class="projects-grid"></div>

          <h3 class="section-title mt-30">Быстрые действия</h3>
          <div class="quick-actions">
            <button class="btn btn-primary" id="go-to-projects-btn">
              Перейти к проектам
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/app/pages/index-page.js"></script>
  </body>
</html>
