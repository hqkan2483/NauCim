<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautilus.CIM - Профили</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SIDEBAR TOGGLE BUTTON -->
    <button class="sidebar-toggle sidebar-open" onclick="toggleSidebar()" aria-label="Toggle sidebar">
        <span class="toggle-icon">☰</span>
    </button>

    <div class="app-container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <strong>Nautilus.CIM</strong>
            </div>
            <div class="sidebar-nav">
                <a href="index.html" class="nav-item">📊 Главная</a>
                
                <!-- Projects Tree -->
                <div class="nav-tree-item">
                    <button class="nav-tree-toggle" onclick="toggleProjectsTree()" aria-expanded="false" aria-label="Toggle projects list">
                        <span class="tree-icon">▶</span>
                        📁 Проекты
                    </button>
                    <div id="projects-tree-container" class="nav-tree-children nav-tree-collapsed">
                        <div id="projects-list-tree"></div>
                        <a href="projects.html" class="nav-tree-link">→ Все проекты</a>
                    </div>
                </div>
                
                <!-- 
                <a href="models.html" class="nav-item">📋 Модели</a>
                <a href="profiles.html" class="nav-item active">⚙️ Профили</a> 
                -->
                
                <div class="nav-section-title">Текущий проект</div>
                <div id="current-project" class="current-project-info">
                    Нет проекта
                </div>

                <div class="nav-section-title">Действия</div>
                <div class="nav-item" onclick="openModal('new-project-modal')">+ Новый проект</div>
                <!-- 
                <div class="nav-item" onclick="openModal('new-model-modal')">⬆️ Импорт модели</div> 
                -->
                <a href="compare.html" class="nav-item">🔍 Сравнение</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="toolbar">
                <div class="toolbar-title">Главная</div>
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="location.reload()">🔄 Обновить</button>
                </div>
            </div>

            <div class="content-area">
                <h3 class="section-title">Недавние проекты</h3>
                <div id="recent-projects" class="projects-grid"></div>

                <h3 class="section-title mt-30">Быстрые действия</h3>
                <div class="quick-actions">
                    <button class="btn btn-primary" onclick="window.location.href='projects.html'">+ Создать новый проект</button>

                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: New Profile -->
    <div id="new-profile-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Создать новый профиль</div>
            <div class="form-group">
                <label class="form-label">Название профиля *</label>
                <input type="text" id="profile-name" class="form-input" placeholder="Например: GOST-58651.2">
            </div>
            <div class="form-group">
                <label class="form-label">Базовая модель *</label>
                <select id="profile-base-model" class="form-select">
                    <option value="">-- Выберите модель --</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Описание</label>
                <textarea id="profile-desc" class="form-textarea" placeholder="Описание профиля"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Версия</label>
                <input type="text" id="profile-version" class="form-input" value="1.0">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('new-profile-modal')">Отмена</button>
                <button class="btn btn-primary" onclick="createProfile()">Создать</button>
            </div>
        </div>
    </div>

    <div id="new-project-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Создать новый проект</div>
            <p class="modal-info-text">Создайте проект в разделе "Проекты"</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="window.location.href='projects.html'">Перейти к проектам</button>
            </div>
        </div>
    </div>

    <div id="new-model-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Добавить модель</div>
            <p class="modal-info-text">Добавьте модель в разделе "Модели"</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="window.location.href='models.html'">Перейти к моделям</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSampleData();
            updateCurrentProject();
            renderDashboard();
            renderProjectsTree();
            restoreSidebarState();
        });

        // Dashboard rendering
        function renderDashboard() {
            renderRecentProjects();
            renderAllProjects();
        }

        function renderRecentProjects() {
            const projects = getAllProjects();
            const recent = projects.slice(0, 3); // Показать 3 последних проекта
            
            const html = recent.map(p => `
                <div class="project-card" onclick="selectProject(${p.id})">
                    
<div class="flex-between mb-10">
                        <div>
                            <div style="font-weight:600; font-size:16px; margin-bottom:5px;">${p.name}</div>
                            <div style="font-size:13px; color:var(--text-secondary);">Версия ${p.version} • Создан: ${p.createdAt || 'N/A'}</div>
                        </div>
                        <div class="flex gap-10">

                            <button class="btn btn-primary btn-small" onclick="openProject(${p.id})">Открыть →</button>
                        </div>
                    </div>
                    <div style="margin-top:10px; color:var(--text-secondary); font-size:14px;">
                        ${p.description || 'Нет описания'}
                    </div>
                    
                </div>
            `).join('');
            
            document.getElementById('recent-projects').innerHTML = html || '<div class="no-items-message">Нет проектов</div>';
        }

        function selectProject(projectId) {
            // Сохранить выбранный проект
            setCurrentProject(projectId);
            
            // Обновить отображение
            updateCurrentProject();
            renderDashboard();
            renderProjectsTree();
        }

        // Sidebar toggle functionality
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.sidebar-toggle');
            
            sidebar.classList.toggle('collapsed');
            toggleBtn.classList.toggle('sidebar-open');
            
            // Save state to localStorage
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);
        }

        // Restore sidebar state on page load
        function restoreSidebarState() {
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.getElementById('sidebar').classList.add('collapsed');
                document.querySelector('.sidebar-toggle').classList.remove('sidebar-open');
            }
        }

        // Projects Tree Navigation
        function toggleProjectsTree() {
            const container = document.getElementById('projects-tree-container');
            const button = document.querySelector('.nav-tree-toggle');
            const isExpanded = button.getAttribute('aria-expanded') === 'true';
            
            if (isExpanded) {
                container.classList.add('nav-tree-collapsed');
                button.setAttribute('aria-expanded', 'false');
            } else {
                container.classList.remove('nav-tree-collapsed');
                button.setAttribute('aria-expanded', 'true');
                renderProjectsTree();
            }
        }

        function renderProjectsTree() {
            const projectsList = document.getElementById('projects-list-tree');
            const projects = getAllProjects();
            const currentProjectId = getCurrentProjectId();
            
            if (!projects || projects.length === 0) {
                projectsList.innerHTML = '<div class="nav-tree-item-link no-projects-tree">Нет проектов</div>';
                return;
            }
            
            const html = projects.map(p => `
                <div class="nav-tree-item-link ${currentProjectId === p.id ? 'active' : ''}" 
                     onclick="selectProject(${p.id}); event.stopPropagation();" 
                     title="${p.name}">
                    📦 ${p.name}
                </div>
            `).join('');
            
            projectsList.innerHTML = html;
        }
    </script>
