      <!-- MAIN CONTENT -->
      <div class="main-content">

          <div class="toolbar-title">Сравнение</div>
          <div class="toolbar-actions">
            <button class="btn btn-primary" onclick="compareProfiles()">
              🔍 Сравнить
            </button>
          </div>
        </div>

        <div class="content-area">
          <div id="compare-container" class="compare-container">
            <!-- Selection Area -->
            <div class="card" style="margin-bottom: 20px">
              <h3 style="margin-bottom: 15px">Выбор объектов для сравнения</h3>
              <div class="compare-selection-grid">
                <div class="form-group">
                  <label class="form-label">Объект 1</label>
                  <select id="profile1" class="form-select">
                    <option value="">-- Выберите --</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Объект 2</label>
                  <select id="profile2" class="form-select">
                    <option value="">-- Выберите --</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Comparison Results -->
            <div
              id="comparison-results"
              class="comparison-results"
              style="display: none"
            >
              <h3>Результаты сравнения</h3>

              <!-- Summary Stats -->
              <div class="comparison-stats">
                <div class="stat-box">
                  <div class="stat-value" id="stat-common">0</div>
                  <div class="stat-label">Общих классов</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value" id="stat-unique1">0</div>
                  <div class="stat-label">Только в профиле 1</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value" id="stat-unique2">0</div>
                  <div class="stat-label">Только в профиле 2</div>
                </div>
              </div>

              <!-- Detailed Comparison -->
              <div class="diff-container">
                <div class="diff-panel">
                  <div class="diff-header" id="profile1-name">Профиль 1</div>
                  <div class="diff-content" id="profile1-details"></div>
                </div>
                <div class="diff-panel">
                  <div class="diff-header" id="profile2-name">Профиль 2</div>
                  <div class="diff-content" id="profile2-details"></div>
                </div>
              </div>

              <!-- Differences List -->
              <div class="differences-section">
                <h4>Детальные различия</h4>
                <div id="differences-list"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        await loadSampleData();
        updateCurrentProject();
        loadAllObjectOptions();
      });

      function loadAllObjectOptions() {
        // Получаем все проекты
        const projects = MemoryStore.getProjects();
        
        let options = '<option value="">-- Выберите объект --</option>';
        
        // Перебираем все проекты и собираем все модели и профили
        projects.forEach(project => {
          // Добавляем модели проекта
          if (project.models && project.models.length > 0) {
            options += `<optgroup label="${project.name} - Модели">`;
            project.models.forEach(model => {
              options += `<option value="model-${project.id}-${model.id}">${model.name} (${model.type})</option>`;
            });
            options += '</optgroup>';
          }
          
          // Добавляем профили проекта
          if (project.profiles && project.profiles.length > 0) {
            options += `<optgroup label="${project.name} - Профили">`;
            project.profiles.forEach(profile => {
              options += `<option value="profile-${project.id}-${profile.id}">${profile.name} v${profile.version}</option>`;
            });
            options += '</optgroup>';
          }
        });

        document.getElementById("profile1").innerHTML = options;
        document.getElementById("profile2").innerHTML = options;
      }

      function compareProfiles() {
        const object1Value = document.getElementById("profile1").value;
        const object2Value = document.getElementById("profile2").value;

        if (!object1Value || !object2Value) {
          alert("Выберите два объекта для сравнения");
          return;
        }

        if (object1Value === object2Value) {
          alert("Выберите разные объекты");
          return;
        }

        // Парсим выбранные значения
        const object1 = parseObjectValue(object1Value);
        const object2 = parseObjectValue(object2Value);

        if (!object1 || !object2) {
          alert("Ошибка получения данных объектов");
          return;
        }

        renderComparison(object1, object2);
      }

      function parseObjectValue(value) {
        // Формат: "model-{projectId}-{objectId}" или "profile-{projectId}-{objectId}"
        const parts = value.split('-');
        if (parts.length !== 3) return null;

        const type = parts[0]; // 'model' или 'profile'
        const projectId = parseInt(parts[1]);
        const objectId = parseInt(parts[2]);

        const project = MemoryStore.getProject(projectId);
        if (!project) return null;

        if (type === 'model') {
          const model = project.models?.find(m => m.id === objectId);
          if (model) {
            return {
              ...model,
              objectType: 'model',
              projectName: project.name
            };
          }
        } else if (type === 'profile') {
          const profile = project.profiles?.find(p => p.id === objectId);
          if (profile) {
            return {
              ...profile,
              objectType: 'profile',
              projectName: project.name
            };
          }
        }

        return null;
      }

      function renderComparison(obj1, obj2) {
        document.getElementById("comparison-results").style.display = "block";

        // Mock statistics
        const common =
          Math.min(obj1.classes || 0, obj2.classes || 0) - Math.floor(Math.random() * 10);
        const unique1 = (obj1.classes || 0) - common;
        const unique2 = (obj2.classes || 0) - common;

        document.getElementById("stat-common").textContent = common;
        document.getElementById("stat-unique1").textContent = unique1;
        document.getElementById("stat-unique2").textContent = unique2;

        // Object names with type indicator
        document.getElementById("profile1-name").textContent = 
          `${obj1.name} (${obj1.objectType === 'model' ? 'Модель' : 'Профиль'})`;
        document.getElementById("profile2-name").textContent = 
          `${obj2.name} (${obj2.objectType === 'model' ? 'Модель' : 'Профиль'})`;

        // Object details - different fields for models and profiles
        document.getElementById("profile1-details").innerHTML = 
          '<table class="table">' +
          '<tr><td style="font-weight:600;">Проект</td><td>' + obj1.projectName + '</td></tr>' +
          '<tr><td style="font-weight:600;">Тип</td><td>' + 
          (obj1.objectType === 'model' ? obj1.type : 'Профиль') + '</td></tr>' +
          (obj1.objectType === 'profile' && obj1.baseModel ? 
            '<tr><td style="font-weight:600;">Базовая модель</td><td>' + obj1.baseModel + '</td></tr>' : '') +
          (obj1.version ? '<tr><td style="font-weight:600;">Версия</td><td>' + obj1.version + '</td></tr>' : '') +
          '<tr><td style="font-weight:600;">Классов</td><td>' + (obj1.classes || 0) + '</td></tr>' +
          '<tr><td style="font-weight:600;">Атрибутов</td><td>' + (obj1.attributes || 0) + '</td></tr>' +
          (obj1.description ? '<tr><td style="font-weight:600;">Описание</td><td>' + obj1.description + '</td></tr>' : '') +
          '</table>';

        document.getElementById("profile2-details").innerHTML =
          '<table class="table">' +
          '<tr><td style="font-weight:600;">Проект</td><td>' + obj2.projectName + '</td></tr>' +
          '<tr><td style="font-weight:600;">Тип</td><td>' + 
          (obj2.objectType === 'model' ? obj2.type : 'Профиль') + '</td></tr>' +
          (obj2.objectType === 'profile' && obj2.baseModel ? 
            '<tr><td style="font-weight:600;">Базовая модель</td><td>' + obj2.baseModel + '</td></tr>' : '') +
          (obj2.version ? '<tr><td style="font-weight:600;">Версия</td><td>' + obj2.version + '</td></tr>' : '') +
          '<tr><td style="font-weight:600;">Классов</td><td>' + (obj2.classes || 0) + '</td></tr>' +
          '<tr><td style="font-weight:600;">Атрибутов</td><td>' + (obj2.attributes || 0) + '</td></tr>' +
          (obj2.description ? '<tr><td style="font-weight:600;">Описание</td><td>' + obj2.description + '</td></tr>' : '') +
          '</table>';

        // Differences list
        const differences = [
          {
            type: "added",
            text: "Класс <strong>RotatingMachineInfo</strong> присутствует только в профиле 2",
          },
          {
            type: "removed",
            text: "Класс <strong>TransformerInfo</strong> присутствует только в профиле 1",
          },
          {
            type: "modified",
            text: "Атрибут <strong>rotorGD2</strong> имеет разную множественность: [0..1] в профиле 1, [1] в профиле 2",
          },
          {
            type: "added",
            text: "Атрибут <strong>ratedVoltage</strong> добавлен в профиле 2",
          },
        ];

        const diffHtml = differences
          .map((d) => {
            const cls =
              d.type === "added"
                ? "diff-added"
                : d.type === "removed"
                ? "diff-removed"
                : "badge";
            const icon =
              d.type === "added" ? "➕" : d.type === "removed" ? "➖" : "🔄";
            return (
              '<div class="card difference-item">' +
              '<span class="' +
              cls +
              ' difference-icon">' +
              icon +
              "</span>" +
              d.text +
              "</div>"
            );
          })
          .join("");

        document.getElementById("differences-list").innerHTML = diffHtml;
      }
    </script>
  </body>
