  <body class="page page-compare">
    <div class="app-container">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="sidebar__header">
          <strong>Nautilus.CIM</strong>
        </div>
        <div class="sidebar__nav">
          <a href="index.html" class="sidebar__nav-item">📊 Главная</a>
          <a href="projects.html" class="sidebar__nav-item">📁 Проекты</a>
          <!-- <a href="models.html" class="sidebar__nav-item">📋 Модели</a>
                <a href="profiles.html" class="sidebar__nav-item">⚙️ Профили</a> -->

          <div class="sidebar__section-title">Текущий проект</div>
          <div
            id="current-project" class="sidebar__section-info" >
            Нет проекта
          </div>

          <div class="sidebar__section-title">Действия</div>
          <a class="sidebar__nav-item" href="projects.html">+ Новый проект</a>
          <!-- <div class="nav-item" onclick="openModal('new-model-modal')">⬆️ Импорт модели</div>
                <a href="compare.html" class="nav-item active">🔍 Сравнение</a> -->
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="app-container__main-content main-content">
        <div class="toolbar">
          <div class="toolbar__title">Сравнение</div>
          <div class="toolbar__actions">
            <button id="compare-btn-top" class="btn btn-primary" type="button">
              🔍 Сравнить
            </button>
          </div>
        </div>

        <div class="main-content__content-area content-area">
          <div id="compare-container" class="compare-container">
            <!-- Selection Area -->
            <div class="card mb-20">
              <h3 class="mb-15">Выбор объектов для сравнения</h3>
              <div class="compare-selection-grid">
                <div>
                  <div class="form-group">
                    <label class="form-label">Объект 1 (что сравниваем)</label>
                    <select id="profile1" class="form-select">
                      <option value="">-- Выберите --</option>
                    </select>
                  </div>

                  <div id="compare-object-one-content" class="hidden"></div>
                </div>
                <div>
                  <div class="form-group">
                    <label class="form-label"
                      >Объект 2 (с чем сравниваем)</label
                    >
                    <select id="profile2" class="form-select">
                      <option value="">-- Выберите --</option>
                    </select>
                  </div>
                  <div id="compare-object-two-content" class="hidden"></div>
                </div>
              </div>

              <div class="divider mt-15 mb-10"></div>
              <form class="compare-settings">
                <div class="form-group">
                  <div class="flex gap-15">
                    <label class="form-label">Режим сравнения</label>
                    <div class="flex gap-15">
                      <label>
                        <input
                          type="radio"
                          name="compareMode"
                          value="full"
                          checked
                        />
                        полное сравнение
                      </label>
                      <label>
                        <input
                          type="radio"
                          name="compareMode"
                          value="selective"
                        />
                        выборочное сравнение
                      </label>
                      <label>
                        <input
                          type="radio"
                          name="compareMode"
                          value="analysis"
                        />
                        режим анализа
                      </label>
                    </div>
                  </div>
                </div>
              </form>

              <div class="divider mt-15 mb-10"></div>

              <div class="quick-actions--compare">
                <button id="compare-btn" class="btn btn-primary" type="button">
                  🔍 Сравнить
                </button>
                <button id="show-results-btn" class="btn btn-primary hidden" type="button">
                  📊 Показать результаты
                </button>
              </div>
            </div>

            <!-- Comparison Results -->
            <div id="comparison-results" class="comparison-results hidden">
              <h3>Результаты сравнения</h3>

              <!-- Summary Stats -->
              <!-- <div class="comparison-stats">
                <div class="stat-box">
                  <div class="stat-value" id="stat-common">0</div>
                  <div class="stat-label">Общих классов</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value" id="stat-unique1">0</div>
                  <div class="stat-label">Только в профиле 1</div>
                </div>
                <div class="stat-box">
                  <div class="stat-value" id="stat-unique2">0</div>
                  <div class="stat-label">Только в профиле 2</div>
                </div>
              </div> -->

              <!-- Detailed Comparison -->
              <div class="diff-container">
                <div class="diff-panel">
                  <div class="diff-header" id="profile1-name">Профиль 1</div>
                  <div class="diff-content" id="profile1-details"></div>
                </div>
                <div class="diff-panel">
                  <div class="diff-header" id="profile2-name">Профиль 2</div>
                  <div class="diff-content" id="profile2-details"></div>
                </div>
              </div>

              <!-- Differences List -->
              <div class="differences-section">
                <h4>Детальные различия</h4>
                <div id="differences-list"></div>
              </div>

              <!-- Save Results Button -->
              <div class="compare-actions">
                <button id="save-results-btn" class="btn btn-primary" type="button">
                  💾 Сохранить результат
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

        <div class="modal-content">
            <div class="modal-title">Создать новый проект</div>
            <p style="color:var(--text-secondary); margin-bottom:15px;">Создайте проект в разделе "Проекты"</p>
            <div class="modal-buttons">

  </body>
</html>
