  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautilus.CIM - Сравнение</title>

    <style>
      .editor-panel-content {
        padding: 10px;
        overflow-y: auto;
        max-height: 400px;
      }
      .tree-item-with-checkbox {
        display: flex;
        align-items: center;
        padding: 3px 0;
        white-space: nowrap;
      }
      .tree-item-checkbox {
        margin-right: 8px;
        cursor: pointer;
      }
      .tree-item-label {
        cursor: pointer;
        user-select: none;
        font-size: 15px;
        white-space: nowrap;
      }
      .tree-toggle {
        display: inline-block;
        width: 20px;
        cursor: pointer;
        user-select: none;
        font-size: 18px;
        margin-right: 4px;
        text-align: center;
      }
      .tree-children {
        display: block;
        margin-left: 20px;
      }
      .tree-children.collapsed {
        display: none;
      }
      .tree-item-with-checkbox:hover {
        background-color: #f5f5f5;
      }
    </style>

    <script src="data.js"></script>
    <script>
      // Helper function for HTML escaping
      function esc(v) {
        if (v === undefined || v === null) return '';
        const d = document.createElement('div');
        d.textContent = String(v);
        return d.innerHTML;
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadSampleData();
        updateCurrentProject();
        loadAllObjectOptions();
        initCompareSettingsLogic();
      });

      function initCompareSettingsLogic() {
        const radios = document.querySelectorAll('input[name="compareMode"]');
        const objOneContent = document.getElementById('compare-object-one-content');
        const objTwoContent = document.getElementById('compare-object-two-content');
        const profile1Select = document.getElementById('profile1');
        const profile2Select = document.getElementById('profile2');

        function applyMode(mode) {
          if (mode === 'full') {
            objOneContent.classList.add('hidden');
            objOneContent.innerHTML = '';
            objTwoContent.classList.add('hidden');
            objTwoContent.innerHTML = '';
          } else if (mode === 'selective') {
            // Require an object selected in profile1
            const val = profile1Select.value;
            if (!val) {
              alert('Выберите объект 1 для выборочного сравнения');
              objOneContent.classList.add('hidden');
              objOneContent.innerHTML = '';
              objTwoContent.classList.add('hidden');
              objTwoContent.innerHTML = '';
              return;
            }
            const obj = parseObjectValue(val);
            if (!obj) {
              alert('Не удалось получить данные выбранного объекта');
              objOneContent.classList.add('hidden');
              objOneContent.innerHTML = '';
              objTwoContent.classList.add('hidden');
              objTwoContent.innerHTML = '';
              return;
            }
            // Render tree for selected object
            currentSelectiveObject = obj; // Save for re-rendering
            objOneContent.classList.remove('hidden');
            objOneContent.innerHTML = renderObjectTreePanel(obj);
            objTwoContent.classList.add('hidden');
            objTwoContent.innerHTML = '';
          } else if (mode === 'analysis') {
            // Require both objects selected
            const val1 = profile1Select.value;
            const val2 = profile2Select.value;
            if (!val1 || !val2) {
              alert('Выберите оба объекта для режима анализа');
              objOneContent.classList.add('hidden');
              objOneContent.innerHTML = '';
              objTwoContent.classList.add('hidden');
              objTwoContent.innerHTML = '';
              return;
            }
            const obj1 = parseObjectValue(val1);
            const obj2 = parseObjectValue(val2);
            if (!obj1 || !obj2) {
              alert('Не удалось получить данные выбранных объектов');
              objOneContent.classList.add('hidden');
              objOneContent.innerHTML = '';
              objTwoContent.classList.add('hidden');
              objTwoContent.innerHTML = '';
              return;
            }
            // Render trees for both objects
            currentSelectiveObject = obj1;
            currentSelectiveObject2 = obj2;
            objOneContent.classList.remove('hidden');
            objOneContent.innerHTML = renderObjectTreePanel(obj1);
            objTwoContent.classList.remove('hidden');
            objTwoContent.innerHTML = renderObjectTreePanel(obj2);
          }
        }

        // Initial apply based on default checked
        const checked = document.querySelector('input[name="compareMode"]:checked');
        applyMode(checked ? checked.value : 'full');

        // Listen for mode changes
        radios.forEach(r => {
          r.addEventListener('change', e => applyMode(e.target.value));
        });

        // If selection changes while in selective or analysis mode, re-render
        profile1Select.addEventListener('change', () => {
          const current = document.querySelector('input[name="compareMode"]:checked');
          if (current && (current.value === 'selective' || current.value === 'analysis')) {
            applyMode(current.value);
          }
        });

        profile2Select.addEventListener('change', () => {
          const current = document.querySelector('input[name="compareMode"]:checked');
          if (current && current.value === 'analysis') {
            applyMode('analysis');
          }
        });
      }

      function renderObjectTreePanel(obj) {
        // Panel header mimicking editor-panel-content style
        const title = `${obj.name} — ${obj.objectType === 'model' ? 'Модель' : 'Профиль'}`;
        const treeHtml = renderSelectiveTree(obj);
        return `
          <div class="card">

            <div class="editor-panel-content">${treeHtml}</div>
          </div>
        `;
      }

      // State for selective tree
      let selectiveExpanded = new Set();
      let selectiveSelected = new Set();
      let currentSelectiveObject = null; // Store current object for re-rendering
      let currentSelectiveObject2 = null; // Store second object for analysis mode

      function renderSelectiveTree(obj) {
        const root = obj.rootPackages || [];
        const baseKey = `sel-${obj.objectType}-${obj.id}`;
        let html = '';
        root.forEach((pkg, idx) => {
          const itemKey = `${baseKey}-pkg-${idx}`;
          html += renderSelectiveNode(pkg, itemKey, 0);
        });
        if (!html) {
          html = '<div class="text-center text-muted" style="padding: 10px;">Нет данных для отображения</div>';
        }
        return html;
      }

      function renderSelectiveNode(node, itemKey, level) {
        const name = esc(node?.name || node?.className || 'Без имени');
        const childrenPkgs = Array.isArray(node.children) ? node.children : Array.isArray(node.packages) ? node.packages : [];
        const elements = Array.isArray(node.elements) ? node.elements : [];
        const hasChildren = (childrenPkgs && childrenPkgs.length) || (elements && elements.length);
        const isExpanded = selectiveExpanded.has(itemKey);
        const isChecked = selectiveSelected.has(itemKey);

        let html = `
          <div class="tree-item-with-checkbox" onclick="toggleSelectiveActive('${itemKey}', event)">
            <span class="tree-toggle" onclick="toggleSelectiveExpand('${itemKey}'); event.stopPropagation();">${hasChildren ? (isExpanded ? '▾' : '▸') : ''}</span>
            <input type="checkbox" id="${itemKey}" class="tree-item-checkbox" ${isChecked ? 'checked' : ''} onclick="toggleSelectiveCheck('${itemKey}', event)">
            <span class="tree-item-label">📦 ${name}</span>
          </div>
        `;

        if (hasChildren) {
          html += `<div class="tree-children ${isExpanded ? '' : 'collapsed'}" id="children-${itemKey}">`;
          // elements first
          elements.forEach((el, eidx) => {
            const eKey = `${itemKey}-elem-${eidx}`;
            const eName = esc(el?.name || el);
            const eChecked = selectiveSelected.has(eKey);
            html += `
              <div class="tree-item-with-checkbox" onclick="toggleSelectiveActive('${eKey}', event)">
                <span class="tree-toggle"></span>
                <input type="checkbox" id="${eKey}" class="tree-item-checkbox" ${eChecked ? 'checked' : ''} onclick="toggleSelectiveCheck('${eKey}', event)">
                <span class="tree-item-label">📄 ${eName}</span>
              </div>
            `;
          });
          // child packages
          childrenPkgs.forEach((pkg, pidx) => {
            const cKey = `${itemKey}-pkg-${pidx}`;
            html += renderSelectiveNode(pkg, cKey, level + 1);
          });
          html += `</div>`;
        }

        return html;
      }

      // Selective tree interactions
      function toggleSelectiveExpand(itemKey) {
        if (selectiveExpanded.has(itemKey)) selectiveExpanded.delete(itemKey);
        else selectiveExpanded.add(itemKey);
        // re-render current selective panel using saved object
        if (currentSelectiveObject) {
          document.getElementById('compare-object-one-content').innerHTML = renderObjectTreePanel(currentSelectiveObject);
        }
      }

      function toggleSelectiveCheck(itemKey, evt) {
        if (evt) evt.stopPropagation();
        const input = document.getElementById(itemKey);
        if (input && input.checked) selectiveSelected.add(itemKey);
        else selectiveSelected.delete(itemKey);
      }

      function toggleSelectiveActive(itemKey, evt) {
        if (evt) evt.stopPropagation();
        // For future: highlight active item, update details
      }

      function loadAllObjectOptions() {
        // Получаем все проекты
        const projects = MemoryStore.getProjects();

        let options = '<option value="">-- Выберите объект --</option>';

        // Перебираем все проекты и собираем все модели и профили
        projects.forEach((project) => {
          // Добавляем модели проекта
          if (project.models && project.models.length > 0) {
            options += `<optgroup label="${project.name} - Модели">`;
            project.models.forEach((model) => {
              options += `<option value="model-${project.id}-${model.id}">${model.name} (${model.type})</option>`;
            });
            options += "</optgroup>";
          }

          // Добавляем профили проекта
          if (project.profiles && project.profiles.length > 0) {
            options += `<optgroup label="${project.name} - Профили">`;
            project.profiles.forEach((profile) => {
              options += `<option value="profile-${project.id}-${profile.id}">${profile.name} v${profile.version}</option>`;
            });
            options += "</optgroup>";
          }
        });

        document.getElementById("profile1").innerHTML = options;
        document.getElementById("profile2").innerHTML = options;
      }

      function compareProfiles() {
        const object1Value = document.getElementById("profile1").value;
        const object2Value = document.getElementById("profile2").value;

        if (!object1Value || !object2Value) {
          alert("Выберите два объекта для сравнения");
          return;
        }

        if (object1Value === object2Value) {
          alert("Выберите разные объекты");
          return;
        }

        // Парсим выбранные значения
        const object1 = parseObjectValue(object1Value);
        const object2 = parseObjectValue(object2Value);

        if (!object1 || !object2) {
          alert("Ошибка получения данных объектов");
          return;
        }

        // Check compare mode
        const mode = document.querySelector('input[name="compareMode"]:checked')?.value || 'full';
        
        if (mode === 'selective') {
          performSelectiveComparison(object1, object2);
        } else if (mode === 'analysis') {
          performAnalysisComparison(object1, object2);
        } else {
          renderComparison(object1, object2);
        }
      }

      function parseObjectValue(value) {
        // Формат: "model-{projectId}-{objectId}" или "profile-{projectId}-{objectId}"
        const parts = value.split("-");
        if (parts.length !== 3) return null;

        const type = parts[0]; // 'model' или 'profile'
        const projectId = parseInt(parts[1]);
        const objectId = parseInt(parts[2]);

        const project = MemoryStore.getProject(projectId);
        if (!project) return null;

        if (type === "model") {
          const model = project.models?.find((m) => m.id === objectId);
          if (model) {
            return {
              ...model,
              objectType: "model",
              projectName: project.name,
              projectId: projectId
            };
          }
        } else if (type === "profile") {
          const profile = project.profiles?.find((p) => p.id === objectId);
          if (profile) {
            return {
              ...profile,
              objectType: "profile",
              projectName: project.name,
              projectId: projectId
            };
          }
        }

        return null;
      }

      // Selective comparison: compare selected items from object1 with object2
      function performSelectiveComparison(object1, object2) {
        if (selectiveSelected.size === 0) {
          alert('Выберите элементы для сравнения в дереве объекта 1');
          return;
        }

        const results = [];
        
        // Process each selected item
        selectiveSelected.forEach(itemKey => {
          const itemData = resolveSelectiveItem(itemKey, object1);
          if (!itemData) return;

          // Find corresponding item in object2
          const matchingItem = findMatchingItemInObject(itemData, object2);
          
          if (!matchingItem) {
            results.push({
              name: itemData.name,
              type: itemData.type,
              status: 'not-found',
              message: `Объект не найден в ${object2.objectType === 'model' ? 'модели' : 'профиле'} "${object2.name}"`
            });
          } else {
            // Compare the items
            const differences = compareItems(itemData.data, matchingItem);
            results.push({
              name: itemData.name,
              type: itemData.type,
              status: differences.length > 0 ? 'different' : 'identical',
              differences: differences,
              message: differences.length === 0 ? 'Расхождений не обнаружено' : `Найдено расхождений: ${differences.length}`
            });
          }
        });

        renderSelectiveComparisonResults(object1, object2, results);
      }

      // Resolve item from selective tree key
      function resolveSelectiveItem(itemKey, sourceObject) {
        const parts = itemKey.split('-');
        // Format: sel-{type}-{id}-pkg-{idx}[-pkg-{idx}]*[-elem-{idx}]
        
        let packages = sourceObject.rootPackages || [];
        let current = null;
        let itemType = 'package';
        
        // Skip first 3 parts (sel-{type}-{id})
        for (let i = 3; i < parts.length; i += 2) {
          const token = parts[i];
          const idx = parseInt(parts[i + 1]);
          
          if (token === 'pkg') {
            current = packages[idx];
            if (!current) return null;
            packages = current.children || current.packages || [];
            itemType = 'package';
          } else if (token === 'elem') {
            const elements = current ? (current.elements || []) : [];
            current = elements[idx];
            itemType = 'element';
            break;
          }
        }
        
        if (!current) return null;
        
        return {
          name: current.name || current.className,
          type: itemType,
          data: current
        };
      }

      // Find matching item in target object by type and name
      function findMatchingItemInObject(sourceItem, targetObject) {
        const searchIn = targetObject.rootPackages || [];
        return searchForMatchingItem(sourceItem, searchIn);
      }

      function searchForMatchingItem(sourceItem, packages) {
        if (!packages || !Array.isArray(packages)) return null;
        
        for (const pkg of packages) {
          // Check if this package matches
          if (sourceItem.type === 'package' && pkg.name === sourceItem.name) {
            return pkg;
          }
          
          // Check elements in this package
          if (sourceItem.type === 'element' && pkg.elements) {
            const match = pkg.elements.find(el => 
              (el.name || el.className) === sourceItem.name
            );
            if (match) return match;
          }
          
          // Recursively search in child packages
          if (pkg.children || pkg.packages) {
            const childMatch = searchForMatchingItem(sourceItem, pkg.children || pkg.packages);
            if (childMatch) return childMatch;
          }
        }
        
        return null;
      }

      // Compare two items and return list of differences
    //   тянет на универсальную функцию сравнения. атрибуты и связи надо сделать так же
      function compareItems(item1, item2) {
        const differences = [];
        
        if (!item1 || !item2) return differences;
        
        // Compare basic properties
        const compareProps = ['name', 'className', 'type', 'description', 'description_ru', 'isAbstract', 'multiplicity'];
        
        compareProps.forEach(prop => {
          const val1 = item1[prop];
          const val2 = item2[prop];
          
          if (val1 !== val2 && (val1 !== undefined || val2 !== undefined)) {
            differences.push({
              field: prop,
              type: 'property',
              value1: val1 === undefined ? '(отсутствует)' : val1,
              value2: val2 === undefined ? '(отсутствует)' : val2,
              message: `Свойство "${prop}": "${val1 || '(пусто)'}" → "${val2 || '(пусто)'}"`
            });
          }
        });
        
        // Compare attributes
        const attrs1 = item1.attributes || [];
        const attrs2 = item2.attributes || [];
        
        if (attrs1.length !== attrs2.length) {
          differences.push({
            field: 'attributes',
            type: 'count',
            value1: attrs1.length,
            value2: attrs2.length,
            message: `Количество атрибутов: ${attrs1.length} → ${attrs2.length}`
          });
        }
        
        // Compare each attribute
        attrs1.forEach(attr1 => {
          const attr2 = attrs2.find(a => a.name === attr1.name);
          if (!attr2) {
            differences.push({
              field: 'attributes',
              type: 'missing',
              value1: attr1.name,
              value2: null,
              message: `Атрибут "${attr1.name}" отсутствует во втором объекте`
            });
          } else {
            // Compare attribute properties
            if (attr1.type !== attr2.type || attr1.dataType !== attr2.dataType) {
              differences.push({
                field: 'attributes',
                type: 'type',
                value1: attr1.type || attr1.dataType,
                value2: attr2.type || attr2.dataType,
                message: `Атрибут "${attr1.name}": тип "${attr1.type || attr1.dataType}" → "${attr2.type || attr2.dataType}"`
              });
            }
            if (attr1.multiplicity !== attr2.multiplicity) {
              differences.push({
                field: 'attributes',
                type: 'multiplicity',
                value1: attr1.multiplicity,
                value2: attr2.multiplicity,
                message: `Атрибут "${attr1.name}": кратность "${attr1.multiplicity || '(не указана)'}" → "${attr2.multiplicity || '(не указана)'}"`
              });
            }
            // Compare description separately
            const desc1 = attr1.description || '';
            const desc2 = attr2.description || '';
            if (desc1 !== desc2) {
              differences.push({
                field: 'attributes',
                type: 'description',
                value1: desc1,
                value2: desc2,
                message: `Атрибут "${attr1.name}": description "${desc1 || '(пусто)'}" → "${desc2 || '(пусто)'}"`
              });
            }
            // Compare description_ru separately
            const descRu1 = attr1.description_ru || '';
            const descRu2 = attr2.description_ru || '';
            if (descRu1 !== descRu2) {
              differences.push({
                field: 'attributes',
                type: 'description_ru',
                value1: descRu1,
                value2: descRu2,
                message: `Атрибут "${attr1.name}": description_ru "${descRu1 || '(пусто)'}" → "${descRu2 || '(пусто)'}"`
              });
            }
          }
        });
        
        // Check for attributes only in item2
        attrs2.forEach(attr2 => {
          const attr1 = attrs1.find(a => a.name === attr2.name);
          if (!attr1) {
            differences.push({
              field: 'attributes',
              type: 'added',
              value1: null,
              value2: attr2.name,
              message: `Атрибут "${attr2.name}" присутствует только во втором объекте`
            });
          }
        });
        
        // Compare links/associations
        const links1 = item1.links || [];
        const links2 = item2.links || [];
        
        if (links1.length !== links2.length) {
          differences.push({
            field: 'links',
            type: 'count',
            value1: links1.length,
            value2: links2.length,
            message: `Количество связей: ${links1.length} → ${links2.length}`
          });
        }
        
        // Compare each link
        links1.forEach(link1 => {
          const link2 = links2.find(l => 
            l.target_class_name === link1.target_class_name && 
            l.relation_kind === link1.relation_kind &&
            l.target_class_role_name === link1.target_class_role_name
          );
          
          if (!link2) {
            differences.push({
              field: 'links',
              type: 'missing',
              value1: `${link1.target_class_role_name || ''} → ${link1.target_class_name} (${link1.relation_kind})`,
              value2: null,
              message: `Связь "${link1.target_class_role_name || ''}" → "${link1.target_class_name}" (${link1.relation_kind}) отсутствует во втором объекте`
            });
          } else {
            // Compare link properties - description separately
            const desc1 = link1.description || '';
            const desc2 = link2.description || '';
            if (desc1 !== desc2) {
              differences.push({
                field: 'links',
                type: 'description',
                value1: desc1,
                value2: desc2,
                message: `Связь "${link1.target_class_role_name || ''}" → "${link1.target_class_name}": description "${desc1 || '(пусто)'}" → "${desc2 || '(пусто)'}"`
              });
            }
            // Compare target_description separately
            const targetDesc1 = link1.target_description || '';
            const targetDesc2 = link2.target_description || '';
            if (targetDesc1 !== targetDesc2) {
              differences.push({
                field: 'links',
                type: 'target_description',
                value1: targetDesc1,
                value2: targetDesc2,
                message: `Связь "${link1.target_class_role_name || ''}" → "${link1.target_class_name}": target_description "${targetDesc1 || '(пусто)'}" → "${targetDesc2 || '(пусто)'}"`
              });
            }
          }
        });
        
        // Check for links only in item2
        links2.forEach(link2 => {
          const link1 = links1.find(l => 
            l.target_class_name === link2.target_class_name && 
            l.relation_kind === link2.relation_kind &&
            l.target_class_role_name === link2.target_class_role_name
          );
          
          if (!link1) {
            differences.push({
              field: 'links',
              type: 'added',
              value1: null,
              value2: `${link2.target_class_role_name || ''} → ${link2.target_class_name} (${link2.relation_kind})`,
              message: `Связь "${link2.target_class_role_name || ''}" → "${link2.target_class_name}" (${link2.relation_kind}) присутствует только во втором объекте`
            });
          }
        });
        
        return differences;
      }

      // Render selective comparison results
      function renderSelectiveComparisonResults(object1, object2, results) {
        document.getElementById("comparison-results").style.display = "block";
        
        // Calculate stats (but don't render comparison-stats block)
        const identical = results.filter(r => r.status === 'identical').length;
        const different = results.filter(r => r.status === 'different').length;
        const notFound = results.filter(r => r.status === 'not-found').length;
        
        // Update headers
        document.getElementById("profile1-name").textContent = `${object1.name} (${object1.objectType === 'model' ? 'Модель' : 'Профиль'})`;
        document.getElementById("profile2-name").textContent = `${object2.name} (${object2.objectType === 'model' ? 'Модель' : 'Профиль'})`;
        
        // Update details
        document.getElementById("profile1-details").innerHTML = 
          `<p><strong>Выбрано для сравнения:</strong> ${results.length} объект(ов)</p>` +
          `<p><strong>Идентичных:</strong> ${identical}</p>` +
          `<p><strong>С различиями:</strong> ${different}</p>` +
          `<p><strong>Не найдено:</strong> ${notFound}</p>`;
        
        document.getElementById("profile2-details").innerHTML = 
          `<p><strong>Проект:</strong> ${object2.projectName}</p>` +
          `<p><strong>Тип:</strong> ${object2.objectType === 'model' ? object2.type : 'Профиль'}</p>`;
        
        // Render differences list
        let diffHtml = '';
        
        results.forEach(result => {
          const statusIcon = result.status === 'identical' ? '✅' : 
                            result.status === 'not-found' ? '❌' : '⚠️';
          const statusClass = result.status === 'identical' ? 'diff-added' : 
                             result.status === 'not-found' ? 'diff-removed' : 'badge';
          
          diffHtml += `
            <div class="card difference-item">
              <h4><span class="${statusClass}">${statusIcon}</span> ${esc(result.name)} (${result.type === 'package' ? 'Пакет' : 'Класс'})</h4>
              <p><strong>${result.message}</strong></p>
          `;
          
          if (result.differences && result.differences.length > 0) {
            diffHtml += `
              <table class="table" style="margin-top: 10px;">
                 <colgroup>
                    <col style="width: 20%;"/>
                    <col style="width: 45%;"/>
                    <col style="width: 20%;"/>
                    <col style="width: 15%;"/>
                  </colgroup>
                <thead>
                  <tr>
                    <th>Объект и характеристика</th>
                    <th>${esc(object1.name)}</th>
                    <th>${esc(object2.name)}</th>
                    <th>Тип изменения</th>
                  </tr>
                </thead>
                <tbody>
            `;
            
            result.differences.forEach(diff => {
              const objLabel = formatDifferenceLabel(diff);
              const value1 = formatDifferenceValue(diff.value1);
              const value2 = formatDifferenceValue(diff.value2);
              const changeType = formatChangeType(diff, object1.name, object2.name);
              
              diffHtml += `
                <tr>
                  <td>${objLabel}</td>
                  <td>${value1}</td>
                  <td>${value2}</td>
                  <td>${changeType}</td>
                </tr>
              `;
            });
            
            diffHtml += `
                </tbody>
              </table>
            `;
          }
          
          diffHtml += '</div>';
        });
        
        document.getElementById("differences-list").innerHTML = diffHtml || '<p class="text-muted">Нет результатов для отображения</p>';
      }

      // Helper function to format difference label (column 1)
      function formatDifferenceLabel(diff) {
        if (diff.field === 'attributes') {
          if (diff.type === 'missing' || diff.type === 'added') {
            return `Атрибут "${esc(diff.value1 || diff.value2)}"`;
          }
          
          const attrName = extractAttributeName(diff.message);
          
          if (diff.type === 'type') {
            return `Атрибут "${attrName}": тип данных`;
          } else if (diff.type === 'multiplicity') {
            return `Атрибут "${attrName}": кратность`;
          } else if (diff.type === 'description') {
            return `Атрибут "${attrName}": описание`;
          } else if (diff.type === 'description_ru') {
            return `Атрибут "${attrName}": описание (рус)`;
          }
        } else if (diff.field === 'links') {
          if (diff.type === 'missing' || diff.type === 'added') {
            const linkInfo = extractLinkInfo(diff.value1 || diff.value2);
            return `Связь "${linkInfo.target}"`;
          }
          
          const linkName = extractLinkName(diff.message);
          
          if (diff.type === 'description') {
            return `Связь "${linkName}": описание`;
          } else if (diff.type === 'target_description') {
            return `Связь "${linkName}": целевой класс`;
          }
        } else {
          // Property-level differences
          return `Свойство "${esc(diff.field)}"`;
        }
        
        return esc(diff.field);
      }

      // Helper function to extract attribute name from message
      function extractAttributeName(message) {
        const match = message.match(/Атрибут "([^"]+)"/);
        return match ? esc(match[1]) : '';
      }

      // Helper function to extract link name from message
      function extractLinkName(message) {
        const match = message.match(/Связь "([^"]+)"/);
        return match ? esc(match[1]) : '';
      }

      // Helper function to extract link info from value string
      function extractLinkInfo(valueStr) {
        if (!valueStr) return { target: '' };
        // Format: "role → TargetClass (kind)"
        const match = String(valueStr).match(/(.+?)\s*→\s*(.+?)\s*\(/);
        if (match) {
          return { role: match[1], target: match[2] };
        }
        return { target: String(valueStr) };
      }

      // Helper function to format values (columns 2 and 3)
      function formatDifferenceValue(value) {
        if (value === null || value === undefined) {
          return '<span style="color: #999; font-style: italic;">отсутствует</span>';
        }
        if (value === '' || value === '(пусто)') {
          return '<span style="color: #999; font-style: italic;">(пусто)</span>';
        }
        if (value === '(отсутствует)') {
          return '<span style="color: #999; font-style: italic;">отсутствует</span>';
        }
        return esc(String(value));
      }

      // Helper function to format change type (column 4)
      function formatChangeType(diff, obj1Name, obj2Name) {
        if (diff.type === 'missing') {
          return `Присутствует только в ${esc(obj1Name)}`;
        } else if (diff.type === 'added') {
          return `Присутствует только в ${esc(obj2Name)}`;
        } else if (diff.type === 'count') {
          return 'Изменено количество';
        } else {
          return 'Изменено значение';
        }
      }

      // Analysis mode comparison (for future implementation)
      function performAnalysisComparison(object1, object2) {
        alert('Режим анализа будет реализован позже');
        // TODO: Implement bidirectional comparison with both trees
      }

      function renderComparison(obj1, obj2) {
        document.getElementById("comparison-results").style.display = "block";

        // Object names with type indicator
        document.getElementById("profile1-name").textContent = `${obj1.name} (${
          obj1.objectType === "model" ? "Модель" : "Профиль"
        })`;
        document.getElementById("profile2-name").textContent = `${obj2.name} (${
          obj2.objectType === "model" ? "Модель" : "Профиль"
        })`;

        // Object details - different fields for models and profiles
        document.getElementById("profile1-details").innerHTML =
          '<table class="table">' +
          '<tr><td style="font-weight:600;">Проект</td><td>' +
          obj1.projectName +
          "</td></tr>" +
          '<tr><td style="font-weight:600;">Тип</td><td>' +
          (obj1.objectType === "model" ? obj1.type : "Профиль") +
          "</td></tr>" +
          (obj1.objectType === "profile" && obj1.baseModel
            ? '<tr><td style="font-weight:600;">Базовая модель</td><td>' +
              obj1.baseModel +
              "</td></tr>"
            : "") +
          (obj1.version
            ? '<tr><td style="font-weight:600;">Версия</td><td>' +
              obj1.version +
              "</td></tr>"
            : "") +
          '<tr><td style="font-weight:600;">Классов</td><td>' +
          (obj1.classes || 0) +
          "</td></tr>" +
          '<tr><td style="font-weight:600;">Атрибутов</td><td>' +
          (obj1.attributes || 0) +
          "</td></tr>" +
          (obj1.description
            ? '<tr><td style="font-weight:600;">Описание</td><td>' +
              obj1.description +
              "</td></tr>"
            : "") +
          "</table>";

        document.getElementById("profile2-details").innerHTML =
          '<table class="table">' +
          '<tr><td style="font-weight:600;">Проект</td><td>' +
          obj2.projectName +
          "</td></tr>" +
          '<tr><td style="font-weight:600;">Тип</td><td>' +
          (obj2.objectType === "model" ? obj2.type : "Профиль") +
          "</td></tr>" +
          (obj2.objectType === "profile" && obj2.baseModel
            ? '<tr><td style="font-weight:600;">Базовая модель</td><td>' +
              obj2.baseModel +
              "</td></tr>"
            : "") +
          (obj2.version
            ? '<tr><td style="font-weight:600;">Версия</td><td>' +
              obj2.version +
              "</td></tr>"
            : "") +
          '<tr><td style="font-weight:600;">Классов</td><td>' +
          (obj2.classes || 0) +
          "</td></tr>" +
          '<tr><td style="font-weight:600;">Атрибутов</td><td>' +
          (obj2.attributes || 0) +
          "</td></tr>" +
          (obj2.description
            ? '<tr><td style="font-weight:600;">Описание</td><td>' +
              obj2.description +
              "</td></tr>"
            : "") +
          "</table>";

        // Differences list
        const differences = [
          {
            type: "added",
            text: "Класс <strong>RotatingMachineInfo</strong> присутствует только в профиле 2",
          },
          {
            type: "removed",
            text: "Класс <strong>TransformerInfo</strong> присутствует только в профиле 1",
          },
          {
            type: "modified",
            text: "Атрибут <strong>rotorGD2</strong> имеет разную множественность: [0..1] в профиле 1, [1] в профиле 2",
          },
          {
            type: "added",
            text: "Атрибут <strong>ratedVoltage</strong> добавлен в профиле 2",
          },
        ];

        const diffHtml = differences
          .map((d) => {
            const cls =
              d.type === "added"
                ? "diff-added"
                : d.type === "removed"
                ? "diff-removed"
                : "badge";
            const icon =
              d.type === "added" ? "➕" : d.type === "removed" ? "➖" : "🔄";
            return (
              '<div class="card difference-item">' +
              '<span class="' +
              cls +
              ' difference-icon">' +
              icon +
              "</span>" +
              d.text +
              "</div>"
            );
          })
          .join("");

        document.getElementById("differences-list").innerHTML = diffHtml;
      }
    </script>
  </body>
</html>
