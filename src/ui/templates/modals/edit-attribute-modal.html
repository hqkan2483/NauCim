<div id="edit-attribute-modal" class="modal">
  <div class="modal-content modal-content--resizable modal-content--edit-attribute">
    <button class="modal-close" data-modal-close aria-label="Закрыть">×</button>

    <div class="modal-title">Редактирование атрибута</div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-attr-name"
          >Название атрибута*</label
        >
        <input type="text" id="edit-attr-name" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-attr-dataType">Тип данных*</label>
        <div class="input-with-button">
          <input
            type="text"
            id="edit-attr-dataType"
            class="form-input"
            required
            placeholder="Например: String, Float, Integer"
          />
          <button
            type="button"
            class="btn-icon btn-icon--input"
            id="edit-attr-dataType-picker-btn"
            title="Выбрать тип данных"
            aria-label="Выбрать тип данных"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-attr-multiplicity">Мн.*</label>
        <input
          type="text"
          id="edit-attr-multiplicity"
          class="form-input"
          placeholder="Например: 1, 0..1, 0..*"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-attr-stereotype">Стереотип</label>
        <input type="text" id="edit-attr-stereotype" class="form-input" />
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-attr-initialValue"
          >Начальное значение</label
        >
        <input type="text" id="edit-attr-initialValue" class="form-input" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-attr-documentation">Описание</label>
        <textarea
          id="edit-attr-documentation"
          class="form-textarea"
          rows="3"
        ></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="edit-attr-documentationRu"
          >Описание (RU)</label
        >
        <textarea
          id="edit-attr-documentationRu"
          class="form-textarea"
          rows="3"
        ></textarea>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="edit-attr-details">Детали</label>
      <textarea
        id="edit-attr-details"
        class="form-textarea"
        rows="4"
      ></textarea>
    </div>

    <div class="modal-buttons">
      <button class="btn btn-secondary" data-modal-close>Отмена</button>
      <button class="btn btn-primary" id="save-attribute-edit-btn">
        Сохранить
      </button>
    </div>
  </div>
</div>
