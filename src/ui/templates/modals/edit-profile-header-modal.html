<div id="edit-profile-header-modal" class="modal">
  <div class="modal-content modal-content--resizable modal-content--edit-profile-header">
    <button
        type="button"
        class="modal-close"
        data-modal-close
        aria-label="Закрыть"
      >
        ×
    </button>
    <div class="modal-title">Редактировать свойства профиля</div>

    <div class="form-group">
      <label class="form-label">Название профиля *</label>
      <input
        type="text"
        id="edit-profile-name"
        class="form-input"
        required
        minlength="3"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea
        id="edit-profile-desc"
        class="form-textarea"
      ></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Версия</label>
      <input
        type="text"
        id="edit-profile-version"
        class="form-input"
        required
      />
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
      <button type="button" class="btn btn-primary" id="save-profile-edit-btn">Сохранить</button>
    </div>
  </div>
</div>
