<div id="import-model-modal" class="modal">
  <div class="modal-content">
    <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>
    <div class="modal-title">Импорт данных в модель</div>

    <div class="form-group">
      <label class="form-label">Путь до JSON-файла (на машине, где запущен backend)</label>
      <input type="text" id="import-model-path" class="form-input" placeholder="C:\\...\\CIM16-model.json" />
      <div class="text-muted" style="font-size: 12px; margin-top: 6px;">
        Можно указать путь или выбрать файл ниже.
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Или выбрать файл</label>
      <input type="file" id="import-model-file" class="form-input" accept="application/json,.json" />
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
      <button type="button" class="btn btn-primary" id="import-model-submit-btn">Импортировать</button>
    </div>
  </div>
</div>
