<div id="report-modal" class="modal" data-overlay-close>
  <div class="modal-content modal-content--resizable">
    <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>

    <div class="modal-header" data-modal-drag-handle>
      <div id="report-modal-title" class="modal-title">Отчёт</div>
    </div>

    <div class="modal-body">
      <div id="report-modal-content"></div>
    </div>

    <div class="modal-buttons modal-footer">
      <button type="button" class="btn btn-secondary" id="report-modal-copy-btn">Скопировать</button>
      <button type="button" class="btn btn-secondary" data-modal-close>Закрыть</button>
    </div>
  </div>
</div>
