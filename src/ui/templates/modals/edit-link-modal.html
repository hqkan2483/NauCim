<div id="edit-link-modal" class="modal">
  <div class="modal-content modal-content--resizable modal-content--edit-link">
    <button
      class="modal-close"
      data-modal-close
      aria-label="Закрыть"
    >
      ×
    </button>
 <div class="modal-header ">
    <div class="modal-title">Редактирование связи</div>

    <div class="form-cell form-cell__line">
        <label class="form-label" for="edit-link-relationKind">Тип связи *</label>
        <select id="edit-link-relationKind" class="form-select" required disabled>
          <option value="Generalization">Generalization (Наследование)</option>
          <option value="Association">Association (Ассоциация)</option>
        </select>
      </div>

 </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-link-targetClassName">Целевой класс *</label>
        <div class="input-with-button">
          <input
            type="text"
            id="edit-link-targetClassName"
            class="form-input"
            required
            placeholder="Название целевого класса"
          />
          <button
            type="button"
            class="btn-icon btn-icon--input"
            id="edit-link-targetClass-picker-btn"
            title="Выбрать класс"
            aria-label="Выбрать класс"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z" />
            </svg>
          </button>
        </div>

        <input type="hidden" id="edit-link-targetClassId" />
      </div>

      <!-- отображается только если связь Generalization -->
      <div class="form-group">
        <label class="form-label" for="edit-link-role">Роль</label>
        <select id="edit-link-role" class="form-select">
          <option value="child">Потомок (child)</option>
          <option value="parent">Родитель (parent)</option>
        </select>
      </div>
    </div>



    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-link-multiplicity">Мн.</label>
        <input
          type="text"
          id="edit-link-multiplicity"
          class="form-input"
          placeholder="Например:  1, 0..1, 0..*" disabled
        />
      </div>

    <div class="form-group">
        <label class="form-label" for="edit-link-stereotype">Стереотип</label>
        <input type="text" id="edit-link-stereotype" class="form-input" placeholder="Например: rs, rf" />
      </div>
    </div>



    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="edit-link-documentation">Описание</label>
        <textarea id="edit-link-documentation" class="form-textarea" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-link-documentationRu">Описание (RU)</label>
        <textarea id="edit-link-documentationRu" class="form-textarea" rows="2"></textarea>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="edit-link-details">Детали</label>
      <textarea id="edit-link-details" class="form-textarea" rows="2"></textarea>
    </div>


    <div class="modal-buttons">
      <button class="btn btn-secondary" data-modal-close>Отмена</button>
      <button class="btn btn-primary" id="save-link-edit-btn">Сохранить</button>
    </div>

</div>
