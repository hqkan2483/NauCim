<div id="import-profile-modal" class="modal">
  <div class="modal-content">
    <button type="button" class="modal-close" data-modal-close aria-label="Закрыть">×</button>

    <div class="modal-header">
      <div class="modal-title">Импорт данных в профиль</div>
    </div>

    <form class="modal-form">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Путь до JSON-файла (на машине, где запущен backend)</label>
          <input
            type="text"
            id="import-profile-path"
            class="form-input"
            placeholder="C:\\...\\GOST-XXXXX.2-profile.json"
          />
          <div class="text-muted" style="font-size: 12px; margin-top: 6px;">
            Можно указать путь или выбрать файл ниже.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Или выбрать файл</label>
          <input
            type="file"
            id="import-profile-file"
            class="form-input"
            accept="application/json,.json"
          />
        </div>
      </div>

      <div class="modal-buttons modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
        <button type="button" class="btn btn-primary" id="import-profile-submit-btn">Импортировать</button>
      </div>
    </form>
  </div>
</div>
