<div id="edit-model-header-modal" class="modal">
  <div class="modal-content modal-content--resizable modal-content--edit-model-header">
    <button
        type="button"
        class="modal-close"
        data-modal-close
        aria-label="Закрыть"
      >
        ×
    </button>
    <div class="modal-title">Редактировать модель</div>

    <div class="form-group">
      <label class="form-label">Название модели *</label>
      <input
        type="text"
        id="edit-model-name"
        class="form-input"
        required
        minlength="3"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea
        id="edit-model-desc"
        class="form-textarea"
      ></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Версия</label>
      <input
        type="text"
        id="edit-model-version"
        class="form-input"
        required
      />
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
      <button type="button" class="btn btn-primary" id="save-model-edit-btn">Сохранить</button>
    </div>
  </div>
</div>
