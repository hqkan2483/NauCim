<div id="new-project-modal" class="modal">
  <div class="modal-content">
    <button
        class="modal-close"
        data-modal-close
        aria-label="Закрыть"
      >
        ×
    </button>
    <div class="modal-title">Создать новый проект</div>
    <div class="form-group">
      <label class="form-label">Название проекта *</label>
      <input
        type="text"
        id="project-name"
        class="form-input"
        placeholder="Введите название"
        required
        minlength="3"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea
        id="project-desc"
        class="form-textarea"
        placeholder="Описание проекта"
      ></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Версия</label>
      <input
        type="text"
        id="project-version"
        class="form-input"
        value="0.1"
      />
    </div>
    <div class="modal-buttons">
      <button class="btn btn-secondary" data-modal-close>Отмена</button>
      <button class="btn btn-primary" id="create-project-btn">
        Создать
      </button>
    </div>
  </div>
</div>
