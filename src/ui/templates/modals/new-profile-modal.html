<div id="new-profile-modal" class="modal">
  <div class="modal-content modal-content--resizable modal-content--new-profile">
    <button
        type="button"
        class="modal-close"
        data-modal-close
        aria-label="Закрыть"
      >
        ×
    </button>
    <div class="modal-title">Создать новый профиль</div>

    <div class="form-group">
      <label class="form-label">Название профиля *</label>
      <input
        type="text"
        id="profile-name"
        class="form-input"
        placeholder="Например:  GOST-58651. 2"
        required
        minlength="3"
      />
    </div>

    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea
        id="profile-desc"
        class="form-textarea"
        placeholder="Описание профиля"
      ></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Версия</label>
      <input
        type="text"
        id="profile-version"
        class="form-input"
        value="0.1"
        required
      />
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
      <button type="button" class="btn btn-primary" id="create-profile-btn">Создать</button>
    </div>
  </div>
</div>
