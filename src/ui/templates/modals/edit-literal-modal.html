<div id="edit-literal-modal" class="modal">
  <div class="modal-content modal-content--resizable">
    <button class="modal-close" data-modal-close aria-label="Закрыть">×</button>

    <div class="modal-header">
      <div class="modal-title" id="edit-literal-modal-title">Редактирование литерала</div>
    </div>

    <form class="modal-form">
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-lit-name">Значение литерала*</label>
            <input type="text" id="edit-lit-name" class="form-input" required />
            <div
              id="edit-lit-name-error"
              class="validation-feedback validation-error hidden"
              role="alert"
              aria-live="polite"
            ></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-lit-initialValue">Начальное значение</label>
            <input type="text" id="edit-lit-initialValue" class="form-input" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-lit-documentation">Описание</label>
            <textarea id="edit-lit-documentation" class="form-textarea" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-lit-documentationRu">Описание (RU)</label>
            <textarea id="edit-lit-documentationRu" class="form-textarea" rows="3"></textarea>
          </div>
        </div>
      </div>

      <div class="modal-buttons modal-footer">
        <button type="button" class="btn btn-secondary" data-modal-close>Отмена</button>
        <button type="button" class="btn btn-primary" id="save-literal-edit-btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>
