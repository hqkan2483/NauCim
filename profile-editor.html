<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautilus.CIM - Редактор профиля</title>

    <!-- Base styles -->
    <link rel="stylesheet" href="src/styles/00-fonts.css" />
    <link rel="stylesheet" href="src/styles/01-tokens.css" />
    <link rel="stylesheet" href="src/styles/02-body.css" />
    <link rel="stylesheet" href="src/styles/03-app-container.css" />
    <link rel="stylesheet" href="src/styles/04-utils.css" />
    <link rel="stylesheet" href="src/styles/05-sidebar-nav.css" />
    <link rel="stylesheet" href="src/styles/06-main-content.css" />
    <link rel="stylesheet" href="src/styles/07-info-style.css" />

    <!-- Component styles -->
    <link rel="stylesheet" href="src/styles/components/buttons.css" />
    <link rel="stylesheet" href="src/styles/components/toolbar.css" />
    <link rel="stylesheet" href="src/styles/components/search-box.css" />
    <link rel="stylesheet" href="src/styles/components/sidebar-nav-tree.css" />
    <link rel="stylesheet" href="src/styles/components/object-container.css" />
    <link rel="stylesheet" href="src/styles/components/tabs.css" />
    <link rel="stylesheet" href="src/styles/components/tables.css" />
    <link rel="stylesheet" href="src/styles/components/diagram.css" />
    <link rel="stylesheet" href="src/styles/components/forms.css" />
    <link rel="stylesheet" href="src/styles/components/warning-content.css" />
    <link rel="stylesheet" href="src/styles/components/modals.css" />
    <link
      rel="stylesheet"
      href="src/styles/components/tree-with-checkbox.css"
    />

    <!-- Profile editor specific styles -->
    <link rel="stylesheet" href="src/styles/pages/profile-editor.css" />

    <!-- Legacy styles (temporary) -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page page-profile-editor">
    <div class="app-container">
      <div class="main-content">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar__title">
            <span id="page-title">Редактор профиля:</span>
            <span class="toolbar__profile-name" id="profile-name-display"
              >Новый профиль</span
            >
          </div>
          <div class="toolbar__actions">
            <button class="btn btn-primary btn-toolbar" id="toggle-mode-btn">
              📐 Режим диаграммы
            </button>
            <button class="btn btn-primary btn-toolbar" id="back-btn">
              ← Назад
            </button>
            <button
              class="btn btn-primary btn-toolbar"
              data-modal-open="new-profile-modal"
            >
              + Создать профиль
            </button>
            <button class="btn btn-primary btn-toolbar" id="save-profile-btn">
              💾 Сохранить профиль
            </button>
          </div>
        </div>

        <!-- Editor Content -->
        <div class="editor-content-area standard-mode" id="editor-content-area">
          <!-- <div class="editor-wrapper"> -->
          <div class="editor-container">
            <!-- Left Panel:  Available Models/Profiles -->
            <div class="editor-panel available-panel" id="available-panel">
              <div class="editor-panel-header">Модели и профили проекта</div>
              <div class="editor-panel-content">
                <div class="search-box">
                  <input
                    type="text"
                    class="search-input"
                    placeholder="Поиск..."
                    id="left-search"
                  />
                </div>
                <div class="editor-panel-tree" id="available-tree"></div>
              </div>
              <div class="editor-panel-actions">
                <button
                  class="btn btn-primary btn--editor-tree"
                  id="transfer-to-profile-btn"
                >
                  → Перенести в профиль
                </button>
                <button
                  class="btn btn-secondary btn--editor-tree"
                  id="clear-left-selection-btn"
                >
                  ✕ Снять выделение
                </button>
              </div>
            </div>

            <div class="left-resizer"></div>

            <!-- Diagram Editor (hidden by default) -->
            <div id="diagram-editor" class="hidden diagram-editor"></div>

            <!-- Details Panel (Standard Mode) -->
            <div class="details-panel" id="details-panel"> </div>


            <div class="right-resizer"></div>

            <!-- Right Panel:  Profile Being Edited -->
            <div class="editor-panel profile-panel" id="profile-panel">
              <div class="editor-panel-header">
                <span id="profile-header-name">Новый профиль</span>
              </div>
              <div class="editor-panel-content">
                <div class="search-box">
                  <input
                    type="text"
                    class="search-input"
                    placeholder="Поиск..."
                    id="right-search"
                  />
                </div>
                <div class="editor-panel-tree" id="profile-tree">
                  <div
                    class="text-center text-muted"
                    style="padding: 40px 20px"
                  >
                    Профиль пуст. Выберите элементы слева и перенесите их в
                    профиль.
                  </div>
                </div>
              </div>
              <div class="editor-panel-actions">
                <button
                  class="btn btn-primary btn--editor-tree"
                  id="remove-from-profile-btn"
                >
                  ✕ Исключить из профиля
                </button>
                <button
                  class="btn btn-secondary btn--editor-tree"
                  id="clear-right-selection-btn"
                >
                  ✕ Снять выделение
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Main script -->
    <script type="module" src="./src/app/pages/profile-editor-page.js"></script>
  </body>
</html>
