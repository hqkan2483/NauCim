<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautilus.CIM - Редактор профиля</title>
    <link rel="stylesheet" href="src/styles/00-fonts.css" />
    <link rel="stylesheet" href="src/styles/01-tokens.css" />
    <link rel="stylesheet" href="src/styles/02-body.css" />
    <link rel="stylesheet" href="src/styles/03-app-container.css" />
    <link rel="stylesheet" href="src/styles/04-utils.css" />
    <link rel="stylesheet" href="src/styles/05-sidebar-nav.css" />
    <link rel="stylesheet" href="src/styles/06-main-content.css" />
    <link rel="stylesheet" href="src/styles/07-info-style.css" />
    <link rel="stylesheet" href="src/styles/components/buttons.css" />
    <link rel="stylesheet" href="src/styles/components/toolbar.css" />
    <link rel="stylesheet" href="src/styles/components/sidebar-nav-tree.css" />
    <link rel="stylesheet" href="src/styles/components/object-container.css" />
    <link rel="stylesheet" href="src/styles/components/tabs.css" />
    <link rel="stylesheet" href="src/styles/components/tables.css" />
    <link rel="stylesheet" href="src/styles/components/diagram.css" />
    <link rel="stylesheet" href="src/styles/components/forms.css" />
    <link rel="stylesheet" href="src/styles/components/warning-content.css" />
    <link rel="stylesheet" href="src/styles/components/modals.css" />


    <link rel="stylesheet" href="src/styles/pages/profile-editor.css" />



    <!-- <link rel="stylesheet" href="styles.css" /> -->

  </head>
  <body class="page page-profile-editor">
    <div class="app-container">
      <!-- MAIN CONTENT -->
      <div class="app-container__main-content main-content">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar__title">
            <span id="page-title">Редактор профиля</span>
            <span class="profile-name-display" id="profile-name-display">
              Новый профиль
            </span>
          </div>

          <div class="toolbar__actions">
            <!-- Diagram mode is disabled in this iteration (no JointJS, etc.) -->
            <button
              class="btn btn-secondary"
              id="toggle-mode-btn"
              data-action="toggle-diagram-mode"
              disabled
              title="Режим диаграммы временно отключён"
              type="button"
            >
              📐 Режим диаграммы
            </button>

            <button
              class="btn btn-secondary"
              data-action="go-back"
              type="button"
            >
              ← Назад
            </button>

            <button class="btn btn-primary" data-action="save-profile" type="button">
              💾 Сохранить профиль
            </button>
          </div>
        </div>

        <!-- Content -->
        <div class="editor-content-area standart-mode" id="profile-editor-root">
          <div class="editor-wrapper editor-content-area">
            <div class="editor-container">
              <!-- LEFT PANEL -->
              <section class="editor-panel" aria-label="Модели и профили проекта">
                <div class="editor-panel-header">Модели и профили проекта</div>

                <div class="editor-panel-content">
                  <div class="search-box">
                    <input
                      type="text"
                      class="search-input"
                      placeholder="Поиск..."
                      id="left-search"
                      autocomplete="off"
                    />
                  </div>

                  <div id="available-tree">
                    <!-- Rendered by src/pages/profile-editor.js -->
                  </div>
                </div>

                <div class="editor-panel-actions">
                  <button
                    class="btn btn-primary"
                    data-action="transfer-to-profile"

                    type="button"
                  >
                    → Перенести в профиль
                  </button>

                  <button
                    class="btn btn-secondary"
                    data-action="clear-selection-left"

                    type="button"
                  >
                    ✕ Снять выделение
                  </button>
                </div>
              </section>

              <!-- Diagram editor slot (kept for future, hidden/unused in this iteration) -->
              <div id="diagram-editor" class="hidden" aria-hidden="true"></div>

              <!-- RIGHT PANEL -->
              <section class="editor-panel" aria-label="Редактируемый профиль">
                <div class="editor-panel-header">
                  <span id="profile-header-name">Новый профиль</span>
                </div>

                <div class="editor-panel-content">
                  <div class="search-box">
                    <input
                      type="text"
                      class="search-input"
                      placeholder="Поиск..."
                      id="right-search"
                      autocomplete="off"
                    />
                  </div>

                  <div id="profile-tree">
                    <!-- Rendered by src/pages/profile-editor.js -->
                    <div class="empty-state">
                      Профиль пуст. Выберите элементы слева и перенесите их в
                      профиль.
                    </div>
                  </div>
                </div>

                <div class="editor-panel-actions">
                  <button
                    class="btn btn-primary"
                    data-action="remove-from-profile"

                    type="button"
                  >
                    ✕ Исключить из профиля
                  </button>

                  <button
                    class="btn btn-secondary"
                    data-action="clear-selection-right"

                    type="button"
                  >
                    ✕ Снять выделение
                  </button>
                </div>
              </section>

              <!-- DETAILS PANEL (carcass stays in HTML) -->
              <aside class="details-panel" id="details-panel" aria-label="Детали">
                <div class="details-panel-content">
                  <div class="tabs" id="details-tabs" role="tablist">
                    <button
                      class="tab active"
                      id="details-tab-model"
                      data-action="switch-details-tab"
                      data-tab="model"
                      type="button"
                      role="tab"
                      aria-selected="true"
                    >
                      Информация об объекте модели
                    </button>

                    <button
                      class="tab"
                      id="details-tab-profile"
                      data-action="switch-details-tab"
                      data-tab="profile"
                      type="button"
                      role="tab"
                      aria-selected="false"
                    >
                      Информация об объекте профиля
                    </button>
                  </div>

                  <!-- JS renders details into this container -->
                  <div id="details-content">
                    <div class="empty-state">
                      Здесь будет отображаться информация об объекте модели или профиля.
                    </div>
                  </div>
                </div>
              </aside>
            </div>

            <!-- Editor-mode details panel slot (kept for future; hidden in this iteration) -->
            <div id="editor-mode-details-panel" class="hidden" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

     <script type="module" src="src/app/pages/profile-editor-page.js"></script>

  </body>
</html>
