<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautilus.CIM - Редактор профиля</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .editor-container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 180px);
        }
        
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        
        .editor-panel-header {
            padding: 15px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
        }
        
        .editor-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .editor-panel-actions {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #f9f9f9;
        }
        
        .transfer-options {
            margin-bottom: 15px;
        }
        
        .transfer-options h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        
        .option-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .option-checkbox input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .option-checkbox label {
            font-size: 13px;
            cursor: pointer;
        }
        
        .tree-item-with-checkbox {
            display: flex;
            align-items: center;
            padding: 4px 0;
        }
        
        .tree-item-checkbox {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .tree-item-label {
            flex: 1;
            cursor: pointer;
            user-select: none;
        }
        
        .tree-indent {
            display: inline-block;
            width: 20px;
        }
        
        .search-box {
            margin-bottom: 15px;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .profile-name-display {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <button
                class="sidebar-toggle sidebar-open"
                onclick="toggleSidebar()"
                aria-label="Toggle sidebar"
            >
                <span class="toggle-icon">☰</span>
            </button>
            <div class="sidebar-header">
                <span id="sidebar-project-title">Nautilus.CIM</span>
            </div>
            <div class="sidebar-nav">
                <a href="projects.html" class="nav-item">📁 Проекты</a>
                <a href="project-details.html" class="nav-item">📋 Структура проекта</a>

                <div class="nav-section-title">Действия</div>
                <a href="compare.html" class="nav-item">🔍 Сравнение</a>
            </div>
        </div>
        <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="toolbar">
                <div class="toolbar-title">
                    <span id="page-title">Редактор профиля</span>
                    <div class="profile-name-display" id="profile-name-display">Новый профиль</div>
                </div>
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="window.history.back()">
                        ← Назад
                    </button>
                    <button class="btn btn-primary" onclick="saveProfile()">
                        💾 Сохранить профиль
                    </button>
                </div>
            </div>

            <div class="content-area">
                <div class="editor-container">
                    <!-- LEFT PANEL: Available Models and Profiles -->
                    <div class="editor-panel">
                        <div class="editor-panel-header">
                            Модели и профили проекта
                        </div>
                        <div class="editor-panel-content">
                            <div class="search-box">
                                <input 
                                    type="text" 
                                    class="search-input" 
                                    placeholder="Поиск..."
                                    id="left-search"
                                    oninput="filterLeftTree()"
                                >
                            </div>
                            <div id="available-tree">
                                <!-- Tree will be rendered here -->
                            </div>
                        </div>
                        <div class="editor-panel-actions">
                            <div class="transfer-options">
                                <h4>Опции переноса</h4>
                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-selected-only" checked>
                                    <label for="option-selected-only">Перенести только выделенные объекты</label>
                                </div>
                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-include-attributes">
                                    <label for="option-include-attributes">Включить атрибуты</label>
                                </div>
                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-include-links">
                                    <label for="option-include-links">Включить связи</label>
                                </div>
                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-include-parents">
                                    <label for="option-include-parents">Включить классы - родители</label>
                                </div>
                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-include-associations">
                                    <label for="option-include-associations">Включить классы, связанные через ассоциацию</label>
                                </div>
                            </div>
                            <button class="btn btn-primary" onclick="transferToProfile()" style="width: 100%;">
                                → Перенести в профиль
                            </button>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: Profile Being Edited -->
                    <div class="editor-panel">
                        <div class="editor-panel-header">
                            <span id="profile-header-name">Новый профиль</span>
                        </div>
                        <div class="editor-panel-content">
                            <div class="search-box">
                                <input 
                                    type="text" 
                                    class="search-input" 
                                    placeholder="Поиск..."
                                    id="right-search"
                                    oninput="filterRightTree()"
                                >
                            </div>
                            <div id="profile-tree">
                                <div class="text-center text-muted" style="padding: 40px 20px;">
                                    Профиль пуст. Выберите элементы слева и перенесите их в профиль.
                                </div>
                            </div>
                        </div>
                        <div class="editor-panel-actions">
                            <button class="btn btn-secondary" onclick="removeFromProfile()" style="width: 100%;">
                                ✕ Исключить выделенное
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="sidebar.js"></script>
    <script>
        let profileData = {
            id: null,
            name: "Новый профиль",
            items: []
        };

        let availableData = [];
        let selectedLeftItems = new Set();
        let selectedRightItems = new Set();

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSampleData();
            loadProfileFromUrl();
            loadAvailableData();
            renderAvailableTree();
            renderProfileTree();
            restoreSidebarState();
        });

        function loadProfileFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('profileId');
            const projectId = getCurrentProjectId();

            if (profileId && projectId) {
                const profile = getProfile(projectId, parseInt(profileId));
                if (profile) {
                    profileData.id = profile.id;
                    profileData.name = profile.name;
                    profileData.items = profile.rootPackages || [];
                    
                    document.getElementById('profile-name-display').textContent = profile.name;
                    document.getElementById('profile-header-name').textContent = profile.name;
                }
            }
        }

        function loadAvailableData() {
            const projectId = getCurrentProjectId();
            if (!projectId) return;

            const project = getProject(projectId);
            if (!project) return;

            availableData = [];

            // Add models
            if (project.models) {
                project.models.forEach(model => {
                    availableData.push({
                        type: 'model',
                        id: model.id,
                        name: model.name,
                        data: model,
                        children: model.rootPackages || []
                    });
                });
            }

            // Add profiles
            if (project.profiles) {
                project.profiles.forEach(profile => {
                    // Don't include the profile being edited
                    if (profile.id !== profileData.id) {
                        availableData.push({
                            type: 'profile',
                            id: profile.id,
                            name: profile.name,
                            data: profile,
                            children: profile.rootPackages || []
                        });
                    }
                });
            }
        }

        function renderAvailableTree() {
            const container = document.getElementById('available-tree');
            let html = '';

            availableData.forEach((item, index) => {
                const itemKey = `left-${item.type}-${item.id}`;
                const isChecked = selectedLeftItems.has(itemKey);
                const icon = item.type === 'model' ? '📋' : '⚙️';

                html += `
                    <div class="tree-item-with-checkbox">
                        <input 
                            type="checkbox" 
                            class="tree-item-checkbox" 
                            id="${itemKey}"
                            ${isChecked ? 'checked' : ''}
                            onchange="toggleLeftItem('${itemKey}')"
                        >
                        <label class="tree-item-label" for="${itemKey}">
                            ${icon} ${item.name} (${item.type === 'model' ? 'Model' : 'Profile'})
                        </label>
                    </div>
                `;

                // Render children (packages)
                if (item.children && item.children.length > 0) {
                    html += renderTreeChildren(item.children, 1, 'left', itemKey);
                }
            });

            container.innerHTML = html || '<div class="text-center text-muted">Нет данных</div>';
        }

        function renderTreeChildren(items, level, side, parentKey) {
            let html = '';
            
            items.forEach((item, index) => {
                const itemKey = `${parentKey}-pkg-${index}`;
                const isChecked = side === 'left' ? 
                    selectedLeftItems.has(itemKey) : 
                    selectedRightItems.has(itemKey);
                
                const indent = '<span class="tree-indent"></span>'.repeat(level);
                
                html += `
                    <div class="tree-item-with-checkbox">
                        <input 
                            type="checkbox" 
                            class="tree-item-checkbox" 
                            id="${itemKey}"
                            ${isChecked ? 'checked' : ''}
                            onchange="${side === 'left' ? 'toggleLeftItem' : 'toggleRightItem'}('${itemKey}')"
                        >
                        <label class="tree-item-label" for="${itemKey}">
                            ${indent}📦 ${item.name || 'Package'}
                        </label>
                    </div>
                `;

                // Render elements
                if (item.elements && item.elements.length > 0) {
                    item.elements.forEach((elem, elemIndex) => {
                        const elemKey = `${itemKey}-elem-${elemIndex}`;
                        const elemChecked = side === 'left' ? 
                            selectedLeftItems.has(elemKey) : 
                            selectedRightItems.has(elemKey);
                        const elemIndent = '<span class="tree-indent"></span>'.repeat(level + 1);
                        
                        html += `
                            <div class="tree-item-with-checkbox">
                                <input 
                                    type="checkbox" 
                                    class="tree-item-checkbox" 
                                    id="${elemKey}"
                                    ${elemChecked ? 'checked' : ''}
                                    onchange="${side === 'left' ? 'toggleLeftItem' : 'toggleRightItem'}('${elemKey}')"
                                >
                                <label class="tree-item-label" for="${elemKey}">
                                    ${elemIndent}📄 ${elem.name || 'Class'}
                                </label>
                            </div>
                        `;
                    });
                }

                // Render child packages
                if (item.children && item.children.length > 0) {
                    html += renderTreeChildren(item.children, level + 1, side, itemKey);
                }
            });

            return html;
        }

        function renderProfileTree() {
            const container = document.getElementById('profile-tree');
            
            if (!profileData.items || profileData.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted" style="padding: 40px 20px;">
                        Профиль пуст. Выберите элементы слева и перенесите их в профиль.
                    </div>
                `;
                return;
            }

            let html = renderTreeChildren(profileData.items, 0, 'right', 'profile');
            container.innerHTML = html;
        }

        function toggleLeftItem(itemKey) {
            const checkbox = document.getElementById(itemKey);
            if (checkbox.checked) {
                selectedLeftItems.add(itemKey);
            } else {
                selectedLeftItems.delete(itemKey);
            }
        }

        function toggleRightItem(itemKey) {
            const checkbox = document.getElementById(itemKey);
            if (checkbox.checked) {
                selectedRightItems.add(itemKey);
            } else {
                selectedRightItems.delete(itemKey);
            }
        }

        function transferToProfile() {
            if (selectedLeftItems.size === 0) {
                alert('Выберите элементы для переноса');
                return;
            }

            // Placeholder for transfer logic
            alert(`Выбрано элементов для переноса: ${selectedLeftItems.size}\n\nФункциональность переноса будет реализована позже.`);
            
            // TODO: Implement actual transfer logic
            // This would involve:
            // 1. Finding selected items in availableData
            // 2. Deep copying them
            // 3. Adding to profileData.items
            // 4. Clearing selectedLeftItems
            // 5. Re-rendering both trees
        }

        function removeFromProfile() {
            if (selectedRightItems.size === 0) {
                alert('Выберите элементы для удаления');
                return;
            }

            // Placeholder for removal logic
            alert(`Выбрано элементов для удаления: ${selectedRightItems.size}\n\nФункциональность удаления будет реализована позже.`);
            
            // TODO: Implement actual removal logic
            // This would involve:
            // 1. Finding selected items in profileData.items
            // 2. Removing them
            // 3. Clearing selectedRightItems
            // 4. Re-rendering profile tree
        }

        function saveProfile() {
            const projectId = getCurrentProjectId();
            if (!projectId) {
                alert('Проект не выбран');
                return;
            }

            // Placeholder for save logic
            alert(`Сохранение профиля "${profileData.name}"...\n\nФункциональность сохранения будет реализована позже.`);
            
            // TODO: Implement actual save logic
            // This would involve:
            // 1. Validating profile data
            // 2. Saving to data structure
            // 3. Redirecting back to project-details.html
        }

        function filterLeftTree() {
            // Placeholder for filter logic
            console.log('Filter left tree');
        }

        function filterRightTree() {
            // Placeholder for filter logic
            console.log('Filter right tree');
        }
    </script>
</body>
</html>
