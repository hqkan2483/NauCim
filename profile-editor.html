<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Nautilus.CIM - Редактор профиля</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            line-height: 1.5;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            flex-shrink: 0;
        }

        .editor-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 5px 20px;
            overflow: hidden;
        }

        .editor-container {
            flex: 1;
            display: flex;
            gap: 10px;
            overflow: hidden;
        }
        
        .editor-panel {
            /* flex: 1; */
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            width: 350px;
        }
        
        .editor-panel-header {
            padding: 5px 15px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
        }
        
        .editor-panel-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 5px 15px;
        }
        
        #available-tree,
        #profile-tree {
            min-width: min-content;
        }
        
        .editor-panel-actions {
            padding: 5px 15px;
            border-top: 1px solid #ddd;
            background: #f9f9f9;
        }
        
        .transfer-options {
            margin-bottom: 15px;
        }
        
        .transfer-options h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        
        .option-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .option-checkbox input[type="checkbox"] {
            margin-right: 8px;
        }
        
        .option-checkbox label {
            font-size: 13px;
            cursor: pointer;
        }
        
        .tree-item-with-checkbox {
            display: flex;
            align-items: center;
            padding: 3px 0;
            white-space: nowrap;
        }
        
        .tree-item-checkbox {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .tree-item-label {
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .tree-indent {
            display: inline-block;
            width: 20px;
        }
        
        .tree-toggle {
            display: inline-block;
            width: 16px;
            cursor: pointer;
            user-select: none;
            font-size: 12px;
            margin-right: 4px;
        }
        
        .tree-children {
            display: block;
        }
        
        .tree-children.collapsed {
            display: none;
        }
        
        .tree-item-with-checkbox.tree-item-selected {
            background-color: #e3f2fd;
        }
        
        .tree-item-with-checkbox:hover {
            background-color: #f5f5f5;
        }
        
        .tree-item-with-checkbox.tree-item-selected:hover {
            background-color: #d1e7fd;
        }
        
        .search-box {
            margin-bottom: 10px;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #4a90e2;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .profile-name-display {
            font-size: 18px;
            font-weight: 600;
            color: #666;
            padding-left: 20px;

            /* margin-top: 5px; */
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- MAIN CONTENT -->

            <div class="toolbar">
                <div class="toolbar-title">
                    <span id="page-title">Редактор профиля</span>
                    <span class="profile-name-display" id="profile-name-display">Новый профиль</span>

                <div class="toolbar-actions">

                            <div id="available-tree">
                                <!-- Tree will be rendered here -->

                        </div>

                                    <label for="option-include-attributes">Включить атрибуты</label>

                                <div class="option-checkbox">
                                    <input type="checkbox" id="option-include-parents">
                                    <label for="option-include-parents">Включить классы - родители</label>
                                </div>
                                <div class="option-checkbox">

                                    <label for="option-include-associations">Включить классы, связанные через ассоциацию</label>

                            <button class="btn btn-primary" onclick="transferToProfile()" style="width: 100%;">

                            </button>

                    </div>

                    <!-- RIGHT PANEL: Profile Being Edited -->
                    <div class="editor-panel">
                        <div class="editor-panel-header">
                            <span id="profile-header-name">Новый профиль</span>

                        <div class="editor-panel-content">
                            <div class="search-box">
                                <input

                            <div id="profile-tree">
                                <div class="text-center text-muted" style="padding: 40px 20px;">
                                    Профиль пуст. Выберите элементы слева и перенесите их в профиль.

                    </div>
                </div>

        </div>

    <script src="data.js"></script>
    <script>
        let profileData = {
            id: null,
            name: "Новый профиль",
            items: []
        };

        let availableData = [];
        let selectedLeftItems = new Set();
        let selectedRightItems = new Set();
        let expandedLeftItems = new Set();
        let expandedRightItems = new Set();
        let activeLeftItem = null;
        let activeRightItem = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSampleData();
            loadProfileFromUrl();
            loadAvailableData();
            renderAvailableTree();
            renderProfileTree();
        });

        function loadProfileFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('profileId');
            const projectId = getCurrentProjectId();

            if (profileId && projectId) {
                const profile = getProfile(projectId, parseInt(profileId));
                if (profile) {
                    profileData.id = profile.id;
                    profileData.name = profile.name;
                    profileData.items = profile.rootPackages || [];
                    
                    document.getElementById('profile-name-display').textContent = profile.name;
                    document.getElementById('profile-header-name').textContent = profile.name;
                }
            }
        }

        function loadAvailableData() {
            const projectId = getCurrentProjectId();
            if (!projectId) return;

            const project = getProject(projectId);
            if (!project) return;

            availableData = [];

            // Add models
            if (project.models) {
                project.models.forEach(model => {
                    availableData.push({
                        type: 'model',
                        id: model.id,
                        name: model.name,
                        data: model,
                        children: model.rootPackages || []
                    });
                });
            }

            // Add profiles
            if (project.profiles) {
                project.profiles.forEach(profile => {
                    // Don't include the profile being edited
                    if (profile.id !== profileData.id) {
                        availableData.push({
                            type: 'profile',
                            id: profile.id,
                            name: profile.name,
                            data: profile,
                            children: profile.rootPackages || []
                        });
                    }
                });
            }
        }

        function renderAvailableTree() {
            const container = document.getElementById('available-tree');
            let html = '';

            availableData.forEach((item, index) => {
                const itemKey = `left-${item.type}-${item.id}`;
                const isChecked = selectedLeftItems.has(itemKey);
                const isExpanded = expandedLeftItems.has(itemKey);
                const icon = item.type === 'model' ? '📋' : '⚙️';
                const hasChildren = item.children && item.children.length > 0;

                const isActive = activeLeftItem === itemKey;
                
                html += `
                    <div class="tree-item-with-checkbox ${isActive ? 'tree-item-selected' : ''}" onclick="setActiveLeftItem('${itemKey}', event)">
                        <span class="tree-toggle" onclick="toggleLeftExpand('${itemKey}'); event.stopPropagation();">
                            ${hasChildren ? (isExpanded ? '▼' : '▶') : ' '}
                        </span>
                        <input 
                            type="checkbox" 
                            class="tree-item-checkbox" 
                            id="${itemKey}"
                            ${isChecked ? 'checked' : ''}
                            onchange="toggleLeftItem('${itemKey}'); event.stopPropagation();"
                            onclick="event.stopPropagation();"
                        >
                        <span class="tree-item-label">
                            ${icon} ${item.name} (${item.type === 'model' ? 'Model' : 'Profile'})
                        </span>
                    </div>
                `;

                // Render children (packages)
                if (hasChildren) {
                    html += `<div class="tree-children ${isExpanded ? '' : 'collapsed'}" id="children-${itemKey}">`;
                    html += renderTreeChildren(item.children, 1, 'left', itemKey);
                    html += `</div>`;
                }
            });

            container.innerHTML = html || '<div class="text-center text-muted">Нет данных</div>';
        }

        function renderTreeChildren(items, level, side, parentKey) {
            let html = '';
            
            items.forEach((item, index) => {
                const itemKey = `${parentKey}-pkg-${index}`;
                const isChecked = side === 'left' ? 
                    selectedLeftItems.has(itemKey) : 
                    selectedRightItems.has(itemKey);
                const isExpanded = side === 'left' ? 
                    expandedLeftItems.has(itemKey) : 
                    expandedRightItems.has(itemKey);
                
                const hasChildren = (item.elements && item.elements.length > 0) || 
                                    (item.children && item.children.length > 0);
                
                const isActive = side === 'left' ? 
                    activeLeftItem === itemKey : 
                    activeRightItem === itemKey;
                
                // const indent = '<span class="tree-indent"></span>'.repeat(level);
                
                html += `
                    <div class="tree-item-with-checkbox ${isActive ? 'tree-item-selected' : ''}" onclick="${side === 'left' ? 'setActiveLeftItem' : 'setActiveRightItem'}('${itemKey}', event)">
                        <span class="tree-toggle" onclick="${side === 'left' ? 'toggleLeftExpand' : 'toggleRightExpand'}('${itemKey}'); event.stopPropagation();">
                            ${hasChildren ? (isExpanded ? '▼' : '▶') : ' '}
                        </span>
                        <input 
                            type="checkbox" 
                            class="tree-item-checkbox" 
                            id="${itemKey}"
                            ${isChecked ? 'checked' : ''}
                            onchange="${side === 'left' ? 'toggleLeftItem' : 'toggleRightItem'}('${itemKey}'); event.stopPropagation();"
                            onclick="event.stopPropagation();"
                        >
                        <span class="tree-item-label">
                            📦 ${item.name || 'Package'}
                        </span>
                    </div>
                `;

                // Render children container
                if (hasChildren) {
                    html += `<div class="tree-children ${isExpanded ? '' : 'collapsed'}" id="children-${itemKey}">`;
                    
                    // Render elements
                    if (item.elements && item.elements.length > 0) {
                        item.elements.forEach((elem, elemIndex) => {
                            const elemKey = `${itemKey}-elem-${elemIndex}`;
                            const elemChecked = side === 'left' ? 
                                selectedLeftItems.has(elemKey) : 
                                selectedRightItems.has(elemKey);
                            const elemActive = side === 'left' ? 
                                activeLeftItem === elemKey : 
                                activeRightItem === elemKey;
                            // const elemIndent = '<span class="tree-indent"></span>'.repeat(level + 1);
                            
                            html += `
                                <div class="tree-item-with-checkbox ${elemActive ? 'tree-item-selected' : ''}" onclick="${side === 'left' ? 'setActiveLeftItem' : 'setActiveRightItem'}('${elemKey}', event)">
                                    <span class="tree-toggle"> </span>
                                    <input 
                                        type="checkbox" 
                                        class="tree-item-checkbox" 
                                        id="${elemKey}"
                                        ${elemChecked ? 'checked' : ''}
                                        onchange="${side === 'left' ? 'toggleLeftItem' : 'toggleRightItem'}('${elemKey}'); event.stopPropagation();"
                                        onclick="event.stopPropagation();"
                                    >
                                    <span class="tree-item-label">
                                        📄 ${elem.name || 'Class'}
                                    </span>
                                </div>
                            `;
                        });
                    }

                    // Render child packages
                    if (item.children && item.children.length > 0) {
                        html += renderTreeChildren(item.children, level + 1, side, itemKey);
                    }
                    
                    html += `</div>`;
                }
            });

            return html;
        }

        function renderProfileTree() {
            const container = document.getElementById('profile-tree');
            
            if (!profileData.items || profileData.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-muted" style="padding: 40px 20px;">
                        Профиль пуст. Выберите элементы слева и перенесите их в профиль.
                    </div>
                `;
                return;
            }

            let html = renderTreeChildren(profileData.items, 0, 'right', 'profile');
            container.innerHTML = html;
        }

        function toggleLeftItem(itemKey) {
            const checkbox = document.getElementById(itemKey);
            if (checkbox.checked) {
                selectedLeftItems.add(itemKey);
            } else {
                selectedLeftItems.delete(itemKey);
            }
        }

        function toggleRightItem(itemKey) {
            const checkbox = document.getElementById(itemKey);
            if (checkbox.checked) {
                selectedRightItems.add(itemKey);
            } else {
                selectedRightItems.delete(itemKey);
            }
        }

        function toggleLeftExpand(itemKey) {
            if (expandedLeftItems.has(itemKey)) {
                expandedLeftItems.delete(itemKey);
            } else {
                expandedLeftItems.add(itemKey);
            }
            renderAvailableTree();
        }

        function toggleRightExpand(itemKey) {
            if (expandedRightItems.has(itemKey)) {
                expandedRightItems.delete(itemKey);
            } else {
                expandedRightItems.add(itemKey);
            }
            renderProfileTree();
        }

        function setActiveLeftItem(itemKey, event) {
            if (event) event.stopPropagation();
            activeLeftItem = itemKey;
            renderAvailableTree();
        }

        function setActiveRightItem(itemKey, event) {
            if (event) event.stopPropagation();
            activeRightItem = itemKey;
            renderProfileTree();
        }

        function transferToProfile() {
            if (selectedLeftItems.size === 0) {
                alert('Выберите элементы для переноса');
                return;
            }

            // Placeholder for transfer logic
            alert(`Выбрано элементов для переноса: ${selectedLeftItems.size}\n\nФункциональность переноса будет реализована позже.`);
            
            // TODO: Implement actual transfer logic
            // This would involve:
            // 1. Finding selected items in availableData
            // 2. Deep copying them
            // 3. Adding to profileData.items
            // 4. Clearing selectedLeftItems
            // 5. Re-rendering both trees
        }

        function removeFromProfile() {
            if (selectedRightItems.size === 0) {
                alert('Выберите элементы для удаления');
                return;
            }

            // Placeholder for removal logic
            alert(`Выбрано элементов для удаления: ${selectedRightItems.size}\n\nФункциональность удаления будет реализована позже.`);
            
            // TODO: Implement actual removal logic
            // This would involve:
            // 1. Finding selected items in profileData.items
            // 2. Removing them
            // 3. Clearing selectedRightItems
            // 4. Re-rendering profile tree
        }

        function saveProfile() {
            const projectId = getCurrentProjectId();
            if (!projectId) {
                alert('Проект не выбран');
                return;
            }

            // Placeholder for save logic
            alert(`Сохранение профиля "${profileData.name}"...\n\nФункциональность сохранения будет реализована позже.`);
            
            // TODO: Implement actual save logic
            // This would involve:
            // 1. Validating profile data
            // 2. Saving to data structure
            // 3. Redirecting back to project-details.html
        }

        function filterLeftTree() {
            // Placeholder for filter logic
            console.log('Filter left tree');
        }

        function filterRightTree() {
            // Placeholder for filter logic
            console.log('Filter right tree');
        }
    </script>
</body>
